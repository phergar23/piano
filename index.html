 toca el comienzo y los pasajes más delicados de cada obra, de memoria y sin parar.","Entre obra y obra, 10 segundos de silencio. No se repite nada.","Apunta dónde has dudado.","Has tocado todo el programa sin parar.","Si mañana es tu examen: solo 30' (simulacro lento con partitura y práctica mental) y a dormir pronto. Si hoy es tu examen: calienta 15' (escala lenta y el comienzo de cada obra) y confía en tu trabajo.","Exámenes de piano (1er trimestre)","Del 9 al 15 de diciembre.","Jueves de exámenes","Repaso mental del examen","Repasar el programa sin piano.","Con la partitura delante, recorre en tu cabeza el comienzo y los puntos de anclaje de cada obra.","Si hoy es tu examen: calienta lo que puedas, confía en tu trabajo y disfruta.","Sabes empezar cada obra desde cualquier anclaje.","Semana de exámenes: Beethoven que canta","Música tranquila para una semana intensa.","Escucha: Sonata «Patética», 2º movimiento (Adagio cantabile).","Pregunta: ¿Dónde está la melodía y dónde el acompañamiento?","Pregunta: ¿Cuántas veces vuelve el tema principal?","Pregunta: ¿Cómo te sientes al escucharla?","Beethoven Pathetique Adagio cantabile","Cómo funciona la memoria musical","Lee la ficha «Cómo funciona la memoria musical» en la Biblioteca.","Manos calientes y sueltas, sin cansarlas.","Escala y arpegio de la semana, lentos, con sonido bonito.","Si en el examen te piden escalas, tócalas como en el examen.","Empieza por la obra más rápida.","los sitios apuntados","Arreglar solo lo que ha fallado en el simulacro.","Con partitura, lento: cada sitio 3 veces bien.","Luego en su contexto (un compás antes y uno después).","Sí, lento: el tempo al que salga perfecto.","Cada sitio sale 3 veces bien.","Empieza por la más lenta y cantabile.","Hoy, en el orden que te hayan dicho para el examen.","Empieza por la que más te guste.","Empieza por la obra que menos te guste: así la dejas hecha.","Hoy solo hay 20 minutos: van enteros a lo más urgente. Lo más importante hoy: Beethoven — verte y oírte como te verá el público.","Variaciones famosas: Mozart y la estrellita","La misma forma que tu Beethoven, con un tema que conoces desde pequeña.","Escucha: Mozart: 12 Variaciones sobre «Ah, vous dirai-je, Maman», K. 265.","Pregunta: ¿Reconoces el tema? (Es «Estrellita, ¿dónde estás?»)","Pregunta: ¿Qué variación es en menor?","Pregunta: ¿Qué hace Mozart que también hace Beethoven en las tuyas?","Mozart K 265 Ah vous dirai-je Maman","El arte de variar","Lee la ficha «El arte de variar» en la Biblioteca.","Lo más importante hoy: Beethoven — aprender a tocar bien con nervios.","Hoy: Tchaikovsky · Álbum para la juventud, Op. 39, n.º 7.","Fijar una digitación para la sección A (1ª página). Un dedo distinto cada vez es un error garantizado en el futuro.","Termina tocando la sección A (1ª página) manos separadas 2 veces sin parar.","Usas siempre los mismos dedos en la sección A (1ª página).","Lo más importante hoy: Beethoven — tocar delante de alguien antes del día de verdad.","Hoy: Tchaikovsky · Álbum para la juventud, Op. 39, n.º 8.","Descubrir cómo está hecha la sección A (1ª página): patrones, escalas, acordes. Lo que entiendes se aprende el doble de rápido.","Busca en la sección A (1ª página) los dibujos que se repiten (secuencias, escalas, arpegios) y enciérralos a lápiz.","Ahora toca la sección A (1ª página) normal, lento, pensando en lo que has descubierto.","La izquierda, como un vals ligero de campanillas.","Lo más importante hoy: Beethoven — entrenar qué hacer si algo falla en el escenario.","Pasaje de hoy: los trinos de la Var. IV.","Hoy: Tchaikovsky · Álbum para la juventud, Op. 39, n.º 9.","Juntar las manos en la sección A (1ª página) sin errores, poco a poco.","Divide la sección A (1ª página) en bloques de 2 compases.","Tocas la sección A (1ª página) manos juntas y sin paradas a ♩. = 36.","Rubato «un poco»: respira al final de las frases, sin perder el pulso.","Mantener en forma la mitad de arriba de la 1ª página y mejorar un detalle.","Toca la mitad de arriba de la 1ª página de memoria a un tempo tranquilo.","Programa de hoy: Beethoven. Y, si quieres, algo más que te guste.","Víspera: Concierto Clásico","Toca Beethoven con partitura, a medio tempo, mirando cada indicación.","Concierto Clásico","Hoy es el día. Beethoven · 18:30 · Claustros de Santo Domingo.","Beethoven con partitura, lento, escuchando cada detalle (7').","18:30 · Claustros de Santo Domingo · Beethoven","Empiezan las vacaciones. Abril de Tchaikovsky será la protagonista de enero.","Toca Tchaikovsky entera, a tu ritmo, sin corregir nada.","Entrenar el oído: sacar una melodía sin partitura.","Saca de oído la melodía de una canción que te guste.","Primero solo la melodía; si sale, añade un bajo sencillo.","Día libre. ¡Disfrútalo!","Descansar también es parte del entrenamiento: la memoria se asienta mientras no tocas.","Hoy no hay sesión.","Si te apetece, escucha algo de la lista de la semana o toca por gusto lo que quieras.","Has descansado.","Sesión de vacaciones","Vacaciones en casa: una hora, con calma y con algo de juego.","Si♭ mayor · sol menor","Escala de Si♭ mayor en movimiento contrario (las manos se separan desde el centro y vuelven).","Escala de Si♭ mayor en terceras (una mano empieza una tercera más arriba), 2 octavas.","Récord de la semana: escala de Si♭ mayor, 4 octavas, al tempo más rápido al que salga limpia. Anótalo en el diario.","Hoy: Tchaikovsky · Álbum para la juventud, Op. 39, n.º 10.","Crear en la sección A (1ª página) puntos seguros desde los que puedas empezar siempre de memoria.","Marca en la sección A (1ª página) 2 o 3 anclajes (comienzos de frase o cambios importantes) con un número dentro de un círculo.","Empiezas desde cualquier anclaje de la sección A (1ª página) sin mirar.","La coda se apaga (morendo) hasta ppp.","Mantener en forma el Tema y las Var. I y II y mejorar un detalle.","Toca el Tema y las Var. I y II de memoria a un tempo tranquilo.","Música de vacaciones","Tocar por gusto: villancicos, de oído, improvisación.","Saca de oído un villancico y ponle un bajo sencillo.","O improvisa sobre él: en menor, en vals, en marcha…","O toca lo que te apetezca.","Te lo has pasado bien.","Si estáis de viaje, hoy no hay piano. No se recupera: al volver, sigue con la sesión de ese día. Si te apetece, escucha la música de la semana en la Biblioteca.","Staccato de muñeca: acordes de Si♭ mayor cortos y ligeros rebotando desde la muñeca, luego desde el brazo (más f). Útil para la marcha de Beethoven.","Hoy: Tchaikovsky · Álbum para la juventud, Op. 39, n.º 11.","Memorizar cada mano por separado en la sección B, con grazia (2ª página). La mano izquierda es la que se olvida primero en el escenario.","Tocas cada mano sola de memoria en la sección B, con grazia (2ª página).","Limpiar los errores que se cuelan con el tiempo en las Var. III y IV.","Toca las Var. III y IV leyendo la partitura, lento, como si fuera nueva.","Igualdad y control en la escala de Si♭ mayor y sol menor: todas las notas como perlas del mismo tamaño.","Escala de Si♭ mayor, 4 octavas, manos juntas.","Ronda 5: normal. Repite con sol menor (menor armónica).","Hoy: Tchaikovsky · Álbum para la juventud, Op. 39, n.º 12.","Pasar la vuelta de A y la coda (3ª página) de la partitura a tu cabeza, 2 compases cada vez.","Tocas la vuelta de A y la coda (3ª página) de memoria, lento, sin mirar.","Mantener en forma las Var. VII y VIII y mejorar un detalle.","Toca las Var. VII y VIII de memoria a un tempo tranquilo.","En la cama o en el coche: recorre Tchaikovsky en tu cabeza con los ojos cerrados, oyendo cada nota y viendo tus dedos. Si te pierdes, al día siguiente mira ese sitio en la partitura.","Arpegio de Si♭ mayor (acorde de tónica): 2 octavas manos separadas, luego 4 octavas manos juntas.","Acordes de Si♭ mayor en posición fundamental y sus 2 inversiones, subiendo y bajando.","Cadencia I–IV–V7–I en Si♭ mayor y en sol menor: haz que la nota de arriba suene más, como una melodía.","Hoy: Tchaikovsky · Álbum para la juventud, Op. 39, n.º 13." const ICON_OK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';

/* ---------- estado de navegación ---------- */
let cur = todayIso();
let tab = "hoy";
let shortMode = false;
let libTab = "escucha";

function setTab(t){
  tab=t;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===t?"true":"false"));
  try{ history.replaceState(null,"","#"+t); }catch(e){}
  render();
  window.scrollTo({top:0});
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));

/* ---------- HOY ---------- */
function nextEvents(from){
  const concert = EVENTS.find(e=>e.k==="concierto" && e.d>=from);
  const ready = EVENTS.find(e=>e.k==="lista" && e.d>=from);
  const exam = EVENTS.find(e=>e.k==="examen" && e.d>=from);
  return {concert,ready,exam};
}
function blocksFor(s){
  let bl = s.b.map((b,i)=>Object.assign({idx:i},b));
  if(!shortMode) return bl;
  const tec = bl.find(b=>b.c==="tec" && b.m>0);
  const reps = bl.filter(b=>b.c==="rep" && b.pr && b.m>0).slice(0,2);
  const ti = bl.find(b=>b.c==="ti" && b.m>0);
  if(!reps.length) return bl;
  const out=[];
  let left = 20 - (tec?4:0) - (ti?3:0);
  if(tec) out.push(Object.assign({},tec,{m:4}));
  if(reps.length===2){ out.push(Object.assign({},reps[0],{m:left-5})); out.push(Object.assign({},reps[1],{m:5})); }
  else out.push(Object.assign({},reps[0],{m:left}));
  if(ti) out.push(Object.assign({},ti,{m:3}));
  return out;
}
function doneSet(d){ return ST.done[d]||{}; }
function sessionProgress(s){
  const bl=s.b.map((b,i)=>i).filter(i=>s.b[i].m>0);
  if(!bl.length) return null;
  const ds=doneSet(s.d); const n=bl.filter(i=>ds[i]).length;
  return {n:n,t:bl.length};
}
function metroHtml(mt){
  if(!mt) return "";
  const u = unitTxt(mt.u||"♩");
  let head="", btn="";
  if(mt.y==="si"){
    head = mt.v ? `<span>Metrónomo: <b>sí</b></span><span class="mv num">${esc(u)} = ${mt.v}</span>` : `<span>Metrónomo: <b>sí</b>, tú eliges el tempo</span>`;
    btn = `<button class="play" data-bpm="${mt.v||60}" data-unit="${esc(u)}" data-beats="${mt.b||4}" aria-label="Abrir metrónomo">▶ Poner</button>`;
  } else if(mt.y==="fin"){
    head = `<span>Metrónomo: <b>solo al final</b></span>` + (mt.v?`<span class="mv num">${esc(u)} = ${mt.v}</span>`:"");
    btn = `<button class="play" data-bpm="${mt.v||60}" data-unit="${esc(u)}" data-beats="${mt.b||4}" aria-label="Abrir metrónomo">▶ Poner</button>`;
  } else {
    head = `<span>Metrónomo: <b>no</b></span>`;
  }
  return `<div class="row"><span class="metro-pill ${mt.y}">${head}${btn}</span></div>` + (mt.tx?`<div class="mtx">${tx(mt.tx)}</div>`:"");
}
function searchLinks(qs){
  if(!qs||!qs.length) return "";
  return `<div class="links">`+qs.map(q=>`<div class="lq"><span>${esc(q)}</span><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank" rel="noopener">YouTube</a><a href="https://open.spotify.com/search/${encodeURIComponent(q)}" target="_blank" rel="noopener">Spotify</a></div>`).join("")+`</div>`;
}
function diceHtml(key){
  const n = ST.anchors[key]||5;
  let opts=""; for(let i=2;i<=10;i++) opts+=`<option ${i===n?"selected":""}>${i}</option>`;
  return `<div class="dice" data-key="${esc(key)}"><span class="small">Anclajes marcados:</span><select aria-label="Número de anclajes">${opts}</select><button class="ghost dice-roll">Tirar el dado</button><span class="res" aria-live="polite">–</span></div>`;
}
function renderHoy(){
  const s = BY[cur];
  const idx = s.i;
  const dayN = idx+1;
  const ne = nextEvents(cur);
  let h = "";
  h += `<div class="daynav">
    <div class="date"><div class="eyebrow">${esc(KINDS[s.k]||"")}${s.ph?" · "+esc(s.ph):""}</div><h1>${longDate(cur)}</h1>
    <div class="sub num">Día ${dayN} de ${SESS.length} del curso${cur===iso(new Date())?" · hoy":""}</div></div>
    <div class="navbtns">
      <button class="iconbtn" id="prevDay" aria-label="Día anterior">‹</button>
      <input type="date" id="pickDay" min="${FIRST}" max="${LAST}" value="${cur}" aria-label="Elegir fecha">
      <button class="iconbtn" id="nextDay" aria-label="Día siguiente">›</button>
      <button class="iconbtn" id="goToday">Hoy</button>
    </div></div>`;
  // cuenta atrás
  let cds="";
  const bigN=n=> n===0?`Hoy<small>&nbsp;</small>`:`${n}<small>${n===1?"día":"días"}</small>`;
  if(ne.concert){ const n=diff(cur,ne.concert.d); cds+=`<div class="cd concert"><div class="big num">${bigN(n)}</div><div class="what"><b>${esc(ne.concert.t)}</b><span>${longDate(ne.concert.d)} · ${tx(ne.concert.x)}</span></div></div>`; }
  if(ne.ready && (!ne.concert || ne.ready.d<=ne.concert.d)){ const n=diff(cur,ne.ready.d); cds+=`<div class="cd ready"><div class="big num">${bigN(n)}</div><div class="what"><b>${tx(ne.ready.t)}</b><span>${longDate(ne.ready.d)} · los conciertos exigen la obra lista 15 días antes</span></div></div>`; }
  else if(ne.exam && diff(cur,ne.exam.d)<=30){ const n=diff(cur,ne.exam.d); cds+=`<div class="cd ready"><div class="big num">${bigN(n)}</div><div class="what"><b>${esc(ne.exam.t)}</b><span>${esc(ne.exam.x)}</span></div></div>`; }
  if(cds) h+=`<div class="count">${cds}</div>`;
  if(s.ev&&s.ev.length){ h+=`<div class="events">`+s.ev.map(e=>`<div class="ev"><span class="kk k-${e.k}">●</span><div><b>${tx(e.t)}</b>${e.d?" · "+tx(e.d):""}</div></div>`).join("")+`</div>`; }
  h += `<div class="focus">${txc(s.f)}</div>`;
  if(s.nt) h+=`<div class="note">${tx(s.nt)}</div>`;

  if(s.k==="descanso"){
    h += `<div class="rest"><div class="big">Hoy, descanso.</div><p class="small">${tx(s.b[0].o)}</p></div>`;
    h += diaryHtml();
    return h;
  }
  const prog = sessionProgress(s);
  const total = blocksFor(s).reduce((a,b)=>a+(b.m||0),0);
  const fullTot = s.b.reduce((a,b)=>a+(b.m||0),0);
  if(fullTot<40 || ["cultura","corta","concierto"].indexOf(s.k)>=0){ shortMode=false; h += `<div class="modebar"><div class="progress num">${fullTot} minutos${prog?` · ${prog.n} de ${prog.t} bloques hechos`:""}</div></div>`; } else
  h += `<div class="modebar"><div class="seg" role="group" aria-label="Duración">
      <button id="modeFull" aria-pressed="${!shortMode}">Sesión completa</button>
      <button id="modeShort" aria-pressed="${shortMode}">Poco tiempo (20′)</button></div>
      <div class="progress num">${total} minutos${prog?` · ${prog.n} de ${prog.t} bloques hechos`:""}</div></div>`;
  if(shortMode) h+=`<div class="note">Versión de 20 minutos: solo lo imprescindible de hoy. Mañana, sesión normal.</div>`;
  h += `<div class="plan">`;
  let t0=0;
  const ds=doneSet(cur);
  blocksFor(s).forEach(b=>{
    const cat = CATS[b.c]||CATS.rep;
    const isDone = !!ds[b.idx];
    const start = t0; t0 += (b.m||0);
    const pname = b.p ? pShort(b.p) : "";
    h += `<article class="blk ${isDone?"done":""}" style="--cat:${cat[1]}">
      <div class="ruler"><span class="t num">${b.m?start+"′":"·"}</span><span class="d num">${b.m?b.m+" min":""}</span></div>
      <div class="body">
        <div class="cat">${esc(cat[0])}${pname?" · "+esc(pname):""}${b.st?`<span class="stage">${tx(b.st)}</span>`:""}</div>
        <h3><span>${tx(b.h)}</span><button class="check" data-bi="${b.idx}" aria-pressed="${isDone}" aria-label="Marcar como hecho">${ICON_OK.replace('width="16" height="16"','width="18" height="18"')}</button></h3>
        ${b.sec && b.c==="rep" ? `<div class="sec">${txc(b.sec)}</div>`:""}
        <div class="obj"><span class="lbl">Objetivo: </span>${tx(b.o)}</div>
        ${b.s&&b.s.length?`<ol class="steps">${b.s.map(x=>`<li>${txc(x)}</li>`).join("")}</ol>`:""}
        ${b.q?searchLinks(b.q):""}
        ${b.lk&&b.lk.length?`<div class="row">${b.lk.map(l=>`<a class="ghost lkbtn" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)} ↗</a>`).join("")}</div>`:""}
        ${b.rd?`<div class="row"><button class="ghost open-read" data-rd="${esc(b.rd)}">Leer la ficha</button></div>`:""}
        ${b.tool==="dado"?diceHtml(b.p||"x"):""}
        ${(["tec","lec","rep"].indexOf(b.c)>=0 || (b.mt&&b.mt.y!=="no")) ? metroHtml(b.mt) : ""}
        ${b.cl&&b.cl.length?`<div class="clave"><b>Clave de la obra</b>${b.cl.map(c=>`<span>${tx(c)}</span>`).join("")}</div>`:""}
        ${b.nt?`<div class="mtx">${tx(b.nt)}</div>`:""}
        <div class="ok">${ICON_OK}<span><span class="lbl">Lo has conseguido si: </span>${tx(b.ok)}</span></div>
        ${b.m?`<div class="row"><button class="ghost timer-start" data-min="${b.m}" data-name="${esc(b.h)}">Temporizador ${b.m}′</button></div>`:""}
      </div></article>`;
  });
  h += `</div>`;
  if(s.x){ h += `<div class="card fuera"><div class="eyebrow">Fuera del piano · opcional</div><h3 style="font-size:1.15rem;margin-top:4px">${tx(s.x.t)}</h3><p style="margin:.4em 0 0">${tx(s.x.tx)}</p></div>`; }
  h += diaryHtml();
  return h;
}
function diaryHtml(){
  const d = ST.diary[cur]||{};
  let en=""; for(let i=1;i<=5;i++) en+=`<button data-e="${i}" aria-pressed="${d.e===i}" aria-label="Energía ${i} de 5">${i}</button>`;
  return `<section class="diary card" style="margin-top:22px"><h2>Diario de hoy</h2>
    <div class="field"><label>¿Con cuánta energía has estudiado? (1 = nada, 5 = muchísima)</label><div class="energy">${en}</div></div>
    <div class="field"><label for="dTxt">¿Qué te ha salido mejor hoy? ¿Qué pruebas mañana?</label><textarea id="dTxt">${esc(d.t||"")}</textarea></div>
    <div class="field"><label for="dClase">Notas de clase (lo que te ha dicho tu profe)</label><textarea id="dClase">${esc(d.c||"")}</textarea></div>
    <div class="saved" id="dSaved"></div></section>`;
}
function bindHoy(){
  $("#prevDay").onclick=()=>{ if(cur>FIRST){cur=addDays(cur,-1);render();} };
  $("#nextDay").onclick=()=>{ if(cur<LAST){cur=addDays(cur,1);render();} };
  $("#goToday").onclick=()=>{ cur=todayIso(); render(); };
  $("#pickDay").onchange=e=>{ const v=e.target.value; if(v&&BY[v]){cur=v;render();} };
  const mf=$("#modeFull"), ms=$("#modeShort");
  if(mf){ mf.onclick=()=>{shortMode=false;render();}; ms.onclick=()=>{shortMode=true;render();}; }
  document.querySelectorAll(".check").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.bi; ST.done[cur]=ST.done[cur]||{};
    if(ST.done[cur][i]) delete ST.done[cur][i]; else ST.done[cur][i]=true;
    save(); const y=window.scrollY; render(); window.scrollTo({top:y});
  });
  bindCommon();
  document.querySelectorAll(".timer-start").forEach(b=>b.onclick=()=>startTimer(+b.dataset.min, b.dataset.name));
  document.querySelectorAll(".dice").forEach(el=>{
    const key=el.dataset.key, sel=el.querySelector("select"), res=el.querySelector(".res");
    sel.onchange=()=>{ ST.anchors[key]=+sel.value; save(); };
    el.querySelector(".dice-roll").onclick=()=>{ const n=+sel.value; let k=0; const iv=setInterval(()=>{ res.textContent=1+Math.floor(Math.random()*n); if(++k>8){clearInterval(iv);} },60); };
  });
  bindDiary();
}
function bindCommon(){
  document.querySelectorAll(".play").forEach(b=>b.onclick=()=>openMetro(+b.dataset.bpm, b.dataset.unit, +b.dataset.beats, true));
  document.querySelectorAll(".open-read").forEach(b=>b.onclick=()=>openReading(b.dataset.rd));
}
function bindDiary(){
  let tmr;
  const put=(k,v)=>{ ST.diary[cur]=ST.diary[cur]||{}; ST.diary[cur][k]=v; save(); const el=$("#dSaved"); if(el){ el.textContent="Guardado"; clearTimeout(tmr); tmr=setTimeout(()=>el.textContent="",1500);} };
  const t=$("#dTxt"), c=$("#dClase");
  if(t) t.oninput=()=>put("t",t.value);
  if(c) c.oninput=()=>put("c",c.value);
  document.querySelectorAll(".energy button").forEach(b=>b.onclick=()=>{ put("e",+b.dataset.e); document.querySelectorAll(".energy button").forEach(x=>x.setAttribute("aria-pressed", x===b?"true":"false")); });
}

/* ---------- CURSO ---------- */
function renderCurso(){
  const today = todayIso();
  let h = `<div class="section"><div class="eyebrow">Curso 2026–27 · academia y conservatorio</div><h2 style="font-size:2rem;margin-top:4px">El mapa del año</h2>
  <p class="small" style="max-width:68ch">Cada concierto monográfico exige la obra memorizada y preparada 15 días antes. El plan está construido hacia atrás desde esas fechas.</p></div>`;
  h += `<div class="section"><h2>Fases</h2><div class="phases">`+PHASES.map(p=>{
    const now = today>=p.a && today<=p.z;
    return `<div class="card phase ${now?"now":""}"><div class="eyebrow">${now?"Ahora · ":""}${shortDate(p.a)} – ${shortDate(p.z)}</div><h3>${esc(p.n)}</h3><p class="small" style="margin:.4em 0 0">${esc(p.f)}</p></div>`; }).join("")+`</div></div>`;
  const kl={concierto:"Concierto",lista:"Obra lista",examen:"Exámenes",esc:"Para ir a escuchar",ensayo:"Ensayo"};
  h += `<div class="section"><h2>Fechas clave</h2><div class="tl">`+EVENTS.filter(e=>!(e.k==="esc"&&e.d==="2026-10-04")).map(e=>{
    const n=diff(today,e.d); const past=n<0;
    return `<div class="tli ${past?"past":""}"><span class="dd num">${shortDate(e.d)}</span><div><span class="kk k-${e.k}">${kl[e.k]||""}</span><div><b>${tx(e.t)}</b>${e.x?` <span class="small">· ${tx(e.x)}</span>`:""}</div></div><span class="left num">${past?"hecho":(n===0?"hoy":"en "+n+" d")}</span></div>`; }).join("")+`</div>
  <p class="small">Masterclass (fechas por concretar): 1er trimestre, Óscar Martín · 2º, Domonkos Csabay · 3º, Mariana Gurkova. Pregunta a tu profe si puedes asistir como oyente o activa.</p></div>`;
  // calendario
  h += `<div class="section"><h2>Calendario</h2><div class="months">`;
  let d = parse(FIRST); d.setDate(1);
  const end = parse(LAST);
  while(d<=end){
    const y=d.getFullYear(), m=d.getMonth();
    const first = new Date(y,m,1), days=new Date(y,m+1,0).getDate();
    let off=(first.getDay()+6)%7;
    let cells=["L","M","X","J","V","S","D"].map(x=>`<span class="wd">${x}</span>`).join("");
    for(let i=0;i<off;i++) cells+=`<span class="dc empty"></span>`;
    for(let k=1;k<=days;k++){
      const s=iso(new Date(y,m,k)); const ss=BY[s];
      if(!ss){ cells+=`<span class="dc empty"></span>`; continue; }
      const pr=sessionProgress(ss);
      let dot=""; if(pr&&pr.n>0) dot=`<i class="dot ${pr.n<pr.t?"half":""}"></i>`;
      cells+=`<button class="dc k-${ss.k} ${s===today?"today":""}" data-go="${s}" aria-label="${longDate(s)}: ${KINDS[ss.k]}">${k}${dot}</button>`;
    }
    h+=`<div class="month"><h3>${MES[m]} ${y}</h3><div class="grid7">${cells}</div></div>`;
    d=new Date(y,m+1,1);
  }
  h += `</div><div class="legend"><span><i style="background:var(--rep)"></i>Concierto</span><span><i style="border-color:var(--rep)"></i>Víspera</span><span><i style="background:color-mix(in srgb,var(--tec) 22%,var(--sheet));border-color:var(--tec)"></i>Examen</span><span><i style="background:var(--tint)"></i>Jueves sin piano (cultura musical)</span><span><i style="background:color-mix(in srgb,var(--ti) 14%,var(--sheet))"></i>Miércoles de 20′</span><span><i style="border-style:dashed"></i>Descanso</span><span>● sesión hecha · ○ a medias</span></div></div>`;
  return h;
}
function bindCurso(){ document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ cur=b.dataset.go; setTab("hoy"); }); }

  <p class="small" style="max-width:68ch">Toca cada sección para cambiar su color cuando avances. El mapa es tuyo: sé sincera y te ayudará a saber dónde poner el esfuerzo.</p>

      <div class="meta">${p.concert?`<span class="pill">${esc(p.concertName)} · ${shortDate(p.concert)}</span>`:""}${p.ready?`<span class="pill">Lista: ${shortDate(p.ready)}</span>`:""}<span class="pill">Al empezar el plan: ${esc(p.now)}</span></div>
      <p style="margin:.6em 0 0">${tx(p.char)}</p>
      <div class="secs">${lv.map((l,i)=>`<button class="sb" data-p="${pid}" data-s="${i}"><span>${esc(p.sections[i])}</span><span class="lv lv${l}">${LEVELS[l]}</span></button>`).join("")}</div>
      <div class="bar" aria-label="Progreso ${pct}%"><i style="width:${pct}%"></i></div>
      <div class="tempo-row"><label for="tp-${pid}"><b>Mi tempo limpio:</b></label><input type="number" id="tp-${pid}" data-tp="${pid}" min="20" max="240" value="${esc(ST.tempo[pid]||"")}" placeholder="—"><span class="small">Objetivo: ${tx(p.target)}</span></div>
      <details><summary>Claves de la obra</summary><ul>${p.keys.map(k=>`<li>${tx(k)}</li>`).join("")}</ul>
      ${pid==="beeth"?`<div class="groups">${GROUPS.map(g=>`<div class="g"><b>${esc(g.label)}</b> · tempo orientativo ${esc(unitTxt(g.unit))} = ${g.target}<br>${g.tips.map(t=>esc(t)).join("<br>")}</div>`).join("")}</div>`:""}</details>

/* ---------- BIBLIOTECA ---------- */
function renderBiblio(){
  const tabs=[["escucha","Escuchas"],["partituras","Partituras de lectura"],["fichas","Compositores y temas"],["estudiar","Cómo estudiar"],["tecnica","Técnica"],["plan","Sobre el plan"]];
  let h=`<div class="section"><div class="eyebrow">Para leer, escuchar y consultar</div><h2 style="font-size:2rem;margin-top:4px">Biblioteca</h2>
  <div class="subtabs">${tabs.map(t=>`<button data-lib="${t[0]}" aria-pressed="${libTab===t[0]}">${t[1]}</button>`).join("")}</div></div><div class="lib">`;
  if(libTab==="escucha"){
    const t=todayIso();
    LISTEN.forEach((w,i)=>{
      const nx = LISTEN[i+1]? LISTEN[i+1].w : "2099-01-01";
      const now = t>=w.w && t<nx;
      h+=`<div class="card ${now?"now":""}"><div class="when">${now?"Esta semana · ":""}Semana del ${shortDate(w.w<FIRST?FIRST:w.w)}</div><h3>${esc(w.t)}</h3><p class="small" style="margin:.3em 0">${esc(w.why)}</p>
      <div><b>Qué escuchar:</b> ${w.what.map(esc).join("; ")}</div><ul style="margin:.4em 0 0;padding-left:1.1em">${w.q.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>${searchLinks(w.s)}</div>`;
    });
  } else if(libTab==="partituras"){
    h+=`<div class="card prose"><h3>Libros de primera vista</h3><p>Todas son partituras gratuitas y legales (dominio público) de IMSLP. En IMSLP, pulsa el archivo PDF y luego «Click here to continue your download» (hay que esperar unos segundos). Consejo: descárgalas en el iPad y ábrelas desde la app Archivos o Libros.</p></div>`;
    RAW.sight.forEach((r,i)=>{ const nx=RAW.sight[i+1]?RAW.sight[i+1].d:"2099"; const now=todayIso()>=r.d&&todayIso()<nx;
      h+=`<div class="card ${now?"now":""}"><div class="when">${now?"Ahora · ":""}Desde el ${shortDate(r.d<FIRST?FIRST:r.d)}</div><h3>${esc(r.t)}</h3><div class="row">${r.lk.map(l=>`<a class="ghost lkbtn" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)} ↗</a>`).join("")}</div></div>`; });
  } else if(libTab==="fichas"){
    Object.keys(READ).forEach(k=>{ h+=readingCard(k); });
  } else if(libTab==="estudiar"){
    h+=`<div class="card prose"><h3>Cómo estudiar</h3>
    <p>Cada bloque de repertorio usa una estrategia concreta. Estudiar bien no es tocar muchas veces la obra de principio a fin: es elegir un objetivo pequeño y conseguirlo.</p>
    <ul><li><b>La regla del 3:</b> un pasaje está aprendido cuando sale 3 veces seguidas sin ningún error. Si fallas, el contador vuelve a cero.</li>
    <li><b>Zonas rojas:</b> los 2 o 3 sitios que más fallan. Se estudian primero, cuando estás fresca, y siempre con un compás antes y otro después.</li>
    <li><b>Anclajes:</b> puntos seguros desde los que puedes empezar siempre. Si te pierdes en un concierto, saltas al siguiente.</li>
    <li><b>Ciclo de corrección de errores:</b> para, localiza el error exacto (nota, dedo o ritmo), arréglalo lento 3 veces, y vuelve a ponerlo en su contexto. Márcalo en la partitura.</li>
    <li><b>Lento de verdad:</b> lento es tan lento que no puedes equivocarte. Si te equivocas, no era lento.</li>
    <li><b>Poco y a menudo:</b> 10 minutos cada día valen más que una hora el sábado. La memoria se asienta durmiendo.</li></ul></div>`;
    h+=`<div class="card strat"><h3>Estrategias del plan</h3>${RAW_STRATS()}</div>`;
  } else if(libTab==="tecnica"){
    h+=`<div class="card prose"><h3>Técnica con cabeza</h3>
    <p>La técnica sirve para tocar música, así que la de este plan sale de tus obras y cambia de tonalidad según lo que estés tocando. Cada día de la semana trabaja una cosa distinta:</p>
    <ul><li><b>Lunes · Escalas con intención:</b> igualdad, dinámicas y ritmos.</li><li><b>Martes · Arpegios y acordes:</b> paso del pulgar y voz de arriba.</li><li><b>Miércoles · Calentamiento exprés:</b> 4 minutos, porque ese día solo hay 20.</li><li><b>Viernes · Velocidad por impulsos:</b> grupos rápidos con parada y relajación.</li><li><b>Sábado · Movimiento contrario y récord:</b> coordinación y medir tu progreso.</li><li><b>Domingo (semanas alternas) · Sonido</b> (peso, legato, staccato, notas repetidas: lo que te hace sonar musical) <b>o Tu obra es tu ejercicio</b> (el pasaje más difícil de la semana convertido en ejercicio).</li></ul>
    <p><b>¿Y el Hanon?</b> Si en la academia te lo mandan, hazlo en el bloque de técnica del viernes, pero nunca en automático: cada repetición distinta (p, f, crescendo, staccato, con ritmos o en otra tonalidad) y siempre escuchando. Un ejercicio mecánico repetido sin escuchar no mejora la música.</p>
    <p><b>Tonalidades del curso:</b> La mayor y fa# menor (octubre) · Mi mayor y do# menor (noviembre) · La mayor y la menor (diciembre) · Si♭ mayor y sol menor (enero y febrero) · Mi♭ mayor y do menor (finales de febrero) · Mi frigio y la cadencia andaluza (Semana Santa) · Sol mayor y mi menor (abril) · Re mayor y si menor (mayo) · Ruleta de todas en junio.</p></div>`;
  } else {
    h+=planInfo();
  }
  h+=`</div>`;
  return h;
}
function RAW_STRATS(){ return STRAT_HTML; }
let STRAT_HTML="";
(function buildStrats(){
  const groups={}; SESS.forEach(s=>s.b.forEach(b=>{ if(b.c==="rep"&&b.st&&b.h&&b.o&&!/Diagnóstico|Víspera|Celebración|Nueva etapa|Exámenes|Por gusto|Obra del Villamarta/.test(b.st)){ const k=b.h; if(!groups[k]) groups[k]={o:b.o,s:b.s,st:b.st}; } }));
  STRAT_HTML = Object.keys(groups).sort((a,b)=>a.localeCompare(b,"es")).map(k=>`<h4>${esc(k)}</h4><div class="o">${esc(groups[k].s.slice(0,3).join(" "))}</div>`).join("");
})();
function readingCard(k){
  const r=READ[k]; if(!r) return "";
  return `<div class="card prose"><div class="when">${esc(r.sub)}</div><h3>${esc(r.t)}</h3>${r.p.map(p=>`<p>${esc(p)}</p>`).join("")}<div class="facts"><b>Curiosidades</b><ul>${r.c.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div></div>`;
}
function planInfo(){
  return `<div class="card prose"><h3>Cómo funciona este cuaderno</h3>
  <p>Cada día tiene su sesión. Ábrela en «Hoy» y sigue los bloques en orden: técnica, primera vista, obras y un último rato para ti. Cada bloque dice su objetivo, cuántos minutos, si va con metrónomo y cómo saber si lo has conseguido.</p>
  <ul><li><b>Si faltas un día, no recuperes.</b> Sigue con la sesión de hoy.</li>
  <li><b>Si tienes poco tiempo,</b> pulsa «Poco tiempo (20′)» y verás la versión de 20 minutos con lo imprescindible.</li>
  <li><b>Tu profe manda.</b> Si en clase te piden otra cosa (otro tempo, otra digitación, otro orden), hazle caso y apúntalo en las notas de clase del diario.</li>
  <li><b>El metrónomo es una herramienta, no un juez.</b> Sirve para construir y comprobar. La música la haces tú.</li>
  <li><b>Tu semana:</b> lunes, martes, viernes y sábado, una hora. Miércoles, 20 minutos solo para lo más urgente. Jueves, sin piano: escucha, lectura y práctica mental. Domingo, la sesión larga (70–75 minutos), con un concierto en casa al final.</li>
  <li><b>El mapa y el diario son tuyos.</b> Se guardan en este dispositivo.</li></ul></div>
  <div class="card prose"><h3>Por qué está hecho así</h3>
  <p>Tocar con memoria y sin errores en un escenario no depende de repetir mucho, sino de repetir bien: objetivos pequeños, estudio lento y atento, memoria construida de varias formas (dedos, oído, vista y análisis) y ensayos de concierto antes del concierto.</p>
  <p>Y el piano no son solo dedos. Por eso hay primera vista cada día (para aprender obras más rápido), escucha y lecturas (para saber qué quieres contar) y momentos para improvisar o tocar lo que te guste (para que el piano siga siendo tuyo).</p></div>
  <div class="card prose"><h3>Para la familia</h3>
  <ul><li>Sed público, no jurado: cuando os toque escuchar, aplaudid y preguntad «¿qué es lo que más te gusta de esta obra?».</li>
  <li>Evitad corregir mientras estudia. Si veis algo, mejor una pregunta después que una indicación durante.</li>
  <li>Valorad el trabajo bien hecho más que el resultado: una sesión con la regla del 3 cumplida es un buen día, aunque la obra aún no esté lista.</li>
  <li>Si un día no hay ganas, la versión de 20 minutos es suficiente. Mantener el hábito importa más que cualquier sesión concreta.</li></ul></div>`;
}
function bindBiblio(){ document.querySelectorAll("[data-lib]").forEach(b=>b.onclick=()=>{ libTab=b.dataset.lib; render(); }); bindCommon(); }

/* ---------- DIARIO ---------- */
function renderDiario(){
  const done = SESS.filter(s=>{ const p=sessionProgress(s); return p&&p.n===p.t; }).length;
  const partial = SESS.filter(s=>{ const p=sessionProgress(s); return p&&p.n>0&&p.n<p.t; }).length;
  const ens = Object.keys(ST.diary).sort().reverse().filter(d=>{const e=ST.diary[d]; return e&&(e.t||e.c||e.e);});
  let h=`<div class="section"><div class="eyebrow">Tu registro</div><h2 style="font-size:2rem;margin-top:4px">Diario</h2>
  <div class="stats"><div class="card stat"><div class="n num">${done}</div><div class="l">sesiones completas</div></div><div class="card stat"><div class="n num">${partial}</div><div class="l">sesiones a medias</div></div><div class="card stat"><div class="n num">${ens.length}</div><div class="l">entradas escritas</div></div></div></div>
  <div class="entries">`;
  if(!ens.length) h+=`<div class="card"><p style="margin:0">Aún no hay entradas. Al final de cada sesión, en «Hoy», escribe una línea: qué ha salido mejor y qué pruebas mañana.</p></div>`;
  ens.forEach(d=>{ const e=ST.diary[d]; h+=`<div class="card entry"><div class="when"><button class="ghost" data-go="${d}">${longDate(d)}</button>${e.e?` <span class="pill">Energía ${e.e}/5</span>`:""}</div>${e.t?`<p>${esc(e.t)}</p>`:""}${e.c?`<p class="small"><b>Clase:</b> ${esc(e.c)}</p>`:""}</div>`; });
  h+=`</div>`;
  return h;
}
function bindDiario(){ document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ cur=b.dataset.go; setTab("hoy"); }); }

/* ---------- AJUSTES ---------- */
function openModal(html){ $("#modalCard").innerHTML=html; $("#modal").hidden=false; }
function closeModal(){ $("#modal").hidden=true; }
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeModal(); } });
function openReading(k){ openModal(readingCard(k).replace('class="card prose"','class="prose"')+`<div class="btnrow"><button class="btn primary" id="mcClose">Cerrar</button></div>`); $("#mcClose").onclick=closeModal; }
$("#btnSettings").onclick=()=>{
  openModal(`<h2>Ajustes</h2>
  <div class="field"><label for="sName">Nombre</label><input type="text" id="sName" value="${esc(ST.set.name)}"></div>
  <div class="field"><label for="sEsp">Título de la obra española</label><input type="text" id="sEsp" value="${esc(ST.set.esp)}" placeholder="Por ejemplo: Albéniz, Tango Op. 165 n.º 2"></div>
  <div class="field"><label for="sFin">Obra del concierto final (Teatro Villamarta)</label><input type="text" id="sFin" value="${esc(ST.set.fin)}" placeholder="La que elija tu profe"></div>
  <div class="field"><label>Tema</label><div class="seg"><button data-th="system">Sistema</button><button data-th="light">Claro</button><button data-th="dark">Oscuro</button></div></div>
  <h3 style="margin-top:18px;font-size:1.1rem">Copia de seguridad</h3>
  <p class="small">Tu progreso se guarda en este dispositivo. Para pasarlo a otro, copia el texto y pégalo allí.</p>
  <div class="btnrow"><button class="btn" id="bCopy">Copiar mi progreso</button><!--DL--><button class="btn" id="bDown">Descargar archivo</button><!--/DL--></div>
  <div class="field"><label for="bIn">Pegar una copia para restaurarla</label><textarea id="bIn" placeholder="Pega aquí el texto copiado"></textarea></div>
  <div class="btnrow"><button class="btn" id="bRestore">Restaurar</button><button class="btn danger" id="bReset">Borrar todo mi progreso</button></div>
  <div class="saved" id="bMsg"></div>
  <div class="btnrow"><button class="btn primary" id="sSave">Guardar y cerrar</button></div>`);
  const th = document.documentElement.getAttribute("data-theme")||"system";
  document.querySelectorAll("[data-th]").forEach(b=>{ b.setAttribute("aria-pressed", b.dataset.th===th?"true":"false"); b.onclick=()=>{ const v=b.dataset.th; if(v==="system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",v); ST.set.theme=v; save(); document.querySelectorAll("[data-th]").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false")); }; });
  const msg=t=>{ $("#bMsg").textContent=t; };
  $("#sSave").onclick=()=>{ ST.set.name=$("#sName").value.trim()||"Julia"; ST.set.esp=$("#sEsp").value.trim(); ST.set.fin=$("#sFin").value.trim(); save(); closeModal(); render(); };
  $("#bCopy").onclick=()=>{ const s=JSON.stringify(ST); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(s).then(()=>msg("Copiado. Pégalo en el otro dispositivo."),()=>{ $("#bIn").value=s; $("#bIn").select(); msg("Selecciónalo y cópialo a mano."); }); } else { $("#bIn").value=s; $("#bIn").select(); msg("Selecciónalo y cópialo a mano."); } };
/*DL*/  if($("#bDown")) $("#bDown").onclick=()=>{ try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(ST)],{type:"application/json"})); a.download="cuaderno-piano-copia-"+iso(new Date())+".json"; document.body.appendChild(a); a.click(); a.remove(); msg("Si no se ha descargado, usa «Copiar mi progreso»."); }catch(e){ msg("No se puede descargar aquí: usa «Copiar mi progreso»."); } };/*/DL*/
  $("#bRestore").onclick=()=>{ try{ const v=JSON.parse($("#bIn").value); if(!v||!v.done) throw 0; ST=Object.assign(defaults(),v); save(); msg("Progreso restaurado."); render(); }catch(e){ msg("Ese texto no es una copia válida."); } };
  let armed=false;
  $("#bReset").onclick=()=>{ if(!armed){ armed=true; $("#bReset").textContent="Pulsa otra vez para confirmar"; return; } ST=defaults(); save(); msg("Progreso borrado."); render(); armed=false; $("#bReset").textContent="Borrar todo mi progreso"; };
};

/* ---------- METRÓNOMO ---------- */
let ac=null, mOn=false, mBpm=60, mBeatsN=4, mNext=0, mBeat=0, mTimer=null, taps=[];
function ensureAC(){ try{ if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); } if(ac.state==="suspended") ac.resume(); }catch(e){} return ac; }
function clickAt(t,acc){ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=acc?1760:1100; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(acc?0.8:0.5,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.06); }
function drawBeats(){ let h=""; for(let i=0;i<mBeatsN;i++) h+=`<i class="${i===0?"first":""}"></i>`; $("#mBeats").innerHTML=h; }
function flash(i){ const dots=$("#mBeats").children; for(let k=0;k<dots.length;k++) dots[k].classList.toggle("on",k===i); }
function sched(){ while(mNext < ac.currentTime+0.12){ const b=mBeat%mBeatsN; clickAt(mNext, b===0&&mBeatsN>1); const delay=Math.max(0,(mNext-ac.currentTime)*1000); setTimeout(()=>flash(b),delay); mNext+=60/mBpm; mBeat++; } }
function mStart(){ if(!ensureAC()) return; mOn=true; mBeat=0; mNext=ac.currentTime+0.08; clearInterval(mTimer); mTimer=setInterval(sched,25); $("#mStart").textContent="Parar"; }
function mStop(){ mOn=false; clearInterval(mTimer); $("#mStart").textContent="Empezar"; flash(-1); }
function setBpm(v){ mBpm=Math.max(30,Math.min(220,Math.round(v))); $("#mBpm").textContent=mBpm; $("#mRange").value=mBpm; }
function openMetro(bpm,unit,beats,autostart){ $("#metro").hidden=false; if(bpm) setBpm(bpm); if(unit) $("#mUnit").textContent=unit; if(beats){ mBeatsN=beats; $("#mMeter").value=String(beats); drawBeats(); } if(autostart){ mStart(); } }
$("#fab").onclick=()=>{ if($("#metro").hidden) openMetro(); else { $("#metro").hidden=true; } };
$("#mClose").onclick=()=>{ mStop(); $("#metro").hidden=true; };
$("#mStart").onclick=()=>{ mOn?mStop():mStart(); };
$("#mMinus").onclick=()=>setBpm(mBpm-1); $("#mPlus").onclick=()=>setBpm(mBpm+1);
$("#mMinus5").onclick=()=>setBpm(mBpm-5); $("#mPlus5").onclick=()=>setBpm(mBpm+5);
$("#mRange").oninput=e=>setBpm(+e.target.value);
$("#mMeter").onchange=e=>{ mBeatsN=+e.target.value; mBeat=0; drawBeats(); };
$("#mTap").onclick=()=>{ const t=performance.now(); taps=taps.filter(x=>t-x<3000); taps.push(t); if(taps.length>=2){ const iv=[]; for(let i=1;i<taps.length;i++) iv.push(taps[i]-taps[i-1]); setBpm(60000/(iv.reduce((a,b)=>a+b,0)/iv.length)); } };
drawBeats();

/* ---------- TEMPORIZADOR ---------- */
let tLeft=0, tRun=false, tInt=null, wake=null;
function fmt(s){ return Math.floor(s/60)+":"+pad(s%60); }
function chime(){ if(!ensureAC()) return; const t=ac.currentTime; [0,0.18,0.36].forEach((d,i)=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type="sine"; o.frequency.value=[880,1108,1318][i]; g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.4,t+d+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.6); o.connect(g); g.connect(ac.destination); o.start(t+d); o.stop(t+d+0.65); }); try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){} }
async function lockOn(){ try{ if("wakeLock" in navigator) wake=await navigator.wakeLock.request("screen"); }catch(e){} }
function lockOff(){ try{ wake&&wake.release(); }catch(e){} wake=null; }
function startTimer(min,name){ ensureAC(); tLeft=min*60; tRun=true; $("#tName").textContent=name; $("#tTime").textContent=fmt(tLeft); $("#timerbar").hidden=false; $("#tPause").textContent="Pausa"; clearInterval(tInt); tInt=setInterval(tick,1000); lockOn(); }
function tick(){ if(!tRun) return; tLeft--; $("#tTime").textContent=fmt(Math.max(0,tLeft)); if(tLeft<=0){ clearInterval(tInt); tRun=false; chime(); $("#tTime").textContent="¡Hecho!"; lockOff(); setTimeout(()=>{ if(!tRun) $("#timerbar").hidden=true; },6000); } }
$("#tPause").onclick=()=>{ tRun=!tRun; $("#tPause").textContent=tRun?"Pausa":"Seguir"; };
$("#tStop").onclick=()=>{ clearInterval(tInt); tRun=false; $("#timerbar").hidden=true; lockOff(); };

/* ---------- render ---------- */
function render(){
  const m=$("#main");
  $("#brandSub").textContent = (ST.set.name?ST.set.name+" · ":"")+"1º de Enseñanzas Profesionales · 2026–27";
  if(tab==="hoy"){ m.innerHTML=renderHoy(); bindHoy(); }
  else if(tab==="curso"){ m.innerHTML=renderCurso(); bindCurso(); }
  else if(tab==="mapa"){ m.innerHTML=renderMapa(); bindMapa(); }
  else if(tab==="biblio"){ m.innerHTML=renderBiblio(); bindBiblio(); }
  else { m.innerHTML=renderDiario(); bindDiario(); }
}
if(ST.set.theme && ST.set.theme!=="system") document.documentElement.setAttribute("data-theme", ST.set.theme);
const h0=(location.hash||"").replace("#","");
setTab(["hoy","curso","mapa","biblio","diario"].indexOf(h0)>=0?h0:"hoy");
})();
</script>
