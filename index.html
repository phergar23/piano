<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Piano">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151D" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuaderno de piano de Julia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Caveat:wght@500;600&display=swap">
<style>
/* Concepto: la agenda de estudio de una pianista. Papel de partitura (Henle), tinta azul
   y lápices de colores como los de su profe: cada tipo de bloque tiene su lápiz.
   La sesión se lee como una regla de minutos de arriba abajo. */
:root{
  --paper:#F5F7FA; --sheet:#FFFFFF; --ink:#1B2533; --muted:#5B6878; --line:#D8DEE6; --henle:#2D4A6D;
  --tec:#2E67A8; --lec:#2F7D4B; --rep:#B8392C; --ti:#A87708; --esc:#71479A; --pre:#4E5968;
  --tint:#EBF0F6; --ok:#2F7D4B; --warn:#B8392C;
  --lvl0:#C9D0D9; --lvl1:#8FB0D6; --lvl2:#E2B84F; --lvl3:#E0894A; --lvl4:#3E9A60;
  --f-display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --r:10px; --gut:16px; --maxw:880px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F151D; --sheet:#161E29; --ink:#E4E9F0; --muted:#98A5B5; --line:#2A3544; --henle:#9DBBE0;
  --tec:#7FB0EA; --lec:#76C394; --rep:#F08A7C; --ti:#E7BD55; --esc:#C29BE6; --pre:#AEB8C6;
  --tint:#1C2735; --ok:#76C394; --warn:#F08A7C;
  --lvl0:#3A4656; --lvl1:#4F79AB; --lvl2:#B8912C; --lvl3:#C4672E; --lvl4:#3F8F5B;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0F151D; --sheet:#161E29; --ink:#E4E9F0; --muted:#98A5B5; --line:#2A3544; --henle:#9DBBE0;
  --tec:#7FB0EA; --lec:#76C394; --rep:#F08A7C; --ti:#E7BD55; --esc:#C29BE6; --pre:#AEB8C6;
  --tint:#1C2735; --ok:#76C394; --warn:#F08A7C;
  --lvl0:#3A4656; --lvl1:#4F79AB; --lvl2:#B8912C; --lvl3:#C4672E; --lvl4:#3F8F5B;
  color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--henle);outline-offset:2px;border-radius:4px}
a{color:var(--henle)}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut);padding-block:0 120px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut);display:flex;align-items:center;gap:12px;min-height:52px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:700;white-space:nowrap}
.brand span{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;height:36px;min-width:36px;display:inline-grid;place-items:center;padding:0 10px}
.tabs{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:700;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--rep)}

/* pentagrama decorativo */
.staff{height:17px;background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 4px);opacity:.9;margin-block:18px 14px}

/* HOY */
.daynav{display:flex;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.daynav .date{flex:1;min-width:200px}
.date h1{font-size:clamp(1.7rem,5.2vw,2.5rem);line-height:1.1}
.date .sub{color:var(--muted);font-size:.92rem;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;background:var(--sheet);white-space:nowrap}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.navbtns{display:flex;gap:6px;align-items:center}
.navbtns input[type=date]{border:1px solid var(--line);background:var(--sheet);border-radius:999px;height:36px;padding:0 10px;max-width:160px}

.count{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:16px}
.cd{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;min-width:0}
.cd .big{font-family:var(--f-display);font-size:2rem;line-height:1;font-weight:700;min-width:2.4ch;text-align:center;flex:none}
.cd .big small{display:block;font-family:var(--f-body);font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.cd .what{min-width:0}
.cd .what b{display:block}
.cd .what span{color:var(--muted);font-size:.86rem}
.cd.concert .big{color:var(--rep)}
.cd.ready .big{color:var(--henle)}

.events{margin-top:12px;display:grid;gap:6px}
.ev{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;padding:8px 12px;border-radius:var(--r);background:var(--tint)}
.ev b{font-weight:700}

.focus{margin-top:18px;font-family:var(--f-hand);font-size:1.6rem;line-height:1.2;color:var(--henle)}
.note{margin-top:10px;font-size:.92rem;color:var(--muted);border-left:0;padding:10px 12px;background:var(--tint);border-radius:var(--r)}

.modebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--sheet);padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.progress{font-size:.88rem;color:var(--muted)}

.plan{margin-top:12px;display:grid;gap:0}
.blk{display:grid;grid-template-columns:64px minmax(0,1fr);gap:0 14px;position:relative}
.ruler{position:relative;text-align:right;padding-top:18px}
.ruler .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem}
.ruler .d{display:block;font-size:.75rem;color:var(--muted)}
.ruler::after{content:"";position:absolute;right:-8px;top:24px;bottom:0;width:3px;border-radius:3px;background:var(--cat)}
.blk:last-child .ruler::after{bottom:18px}
.body{padding-block:14px 18px;border-bottom:1px solid var(--line);min-width:0}
.blk:last-child .body{border-bottom:0}
.cat{color:var(--cat);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cat .stage{color:var(--muted);letter-spacing:.04em;text-transform:none;font-weight:400}
.blk h3{font-size:1.35rem;margin-top:4px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--sheet);display:grid;place-items:center;margin-top:-2px}
.check svg{width:18px;height:18px;opacity:0}
.check[aria-pressed="true"]{background:var(--cat);border-color:var(--cat)}
.check[aria-pressed="true"] svg{opacity:1;color:var(--paper)}
.blk.done .body > *:not(h3){opacity:.55}
.sec{font-size:.92rem;color:var(--muted);margin-top:2px}
.lbl{font-weight:700}
.obj{margin-top:8px}
.steps{margin:8px 0 0;padding-left:1.4em;display:grid;gap:4px}
.steps li::marker{color:var(--cat);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.metro-pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 6px 4px 12px;font-size:.9rem;border:1px solid var(--line);background:var(--sheet)}
.metro-pill.si{border-color:color-mix(in srgb,var(--tec) 55%,var(--line))}
.metro-pill .mv{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.play{border:0;background:var(--ink);color:var(--paper);border-radius:999px;height:28px;padding:0 10px;font-size:.8rem;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.lkbtn{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.ghost{border:1px solid var(--line);background:var(--sheet);border-radius:999px;height:32px;padding:0 12px;font-size:.85rem;font-weight:700}
.mtx{font-size:.86rem;color:var(--muted);margin-top:4px}
.ok{margin-top:10px;font-size:.95rem;display:flex;gap:8px;align-items:flex-start}
.ok svg{flex:none;margin-top:3px;color:var(--ok)}
.clave{margin-top:10px;font-size:.92rem;font-style:italic;color:var(--muted);display:grid;gap:3px}
.clave b{font-style:normal;color:var(--ink)}
.small{font-size:.86rem;color:var(--muted)}
.links{display:grid;gap:6px;margin-top:10px}
.lq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.88rem}
.lq span{color:var(--muted);min-width:0}
.lq a{font-size:.8rem;font-weight:700;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--sheet)}
.dice{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;border:1px dashed var(--line);border-radius:var(--r)}
.dice select{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:3px 6px}
.dice .res{font-family:var(--f-display);font-size:1.8rem;font-weight:700;min-width:1.5ch;color:var(--cat)}

.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.fuera{margin-top:18px}
.diary{margin-top:22px}
.diary h2{font-size:1.4rem}
.field{display:grid;gap:4px;margin-top:10px}
.field label{font-weight:700;font-size:.9rem}
textarea,input[type=text],input[type=number]{width:100%;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 10px}
textarea{min-height:70px;resize:vertical}
.energy{display:flex;gap:6px}
.energy button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);font-family:var(--f-display);font-size:1.1rem}
.energy button[aria-pressed="true"]{background:var(--ti);border-color:var(--ti);color:var(--paper)}
.saved{font-size:.8rem;color:var(--ok);min-height:1.2em}

/* CURSO */
.section{margin-top:26px}
.section > h2{font-size:1.6rem;margin-bottom:10px}
.tl{display:grid;gap:0}
.tli{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.tli.past{opacity:.5}
.tli .dd{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem}
.tli .kk{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.tli .left{font-size:.85rem;color:var(--muted);white-space:nowrap}
.k-concierto{color:var(--rep)} .k-examen{color:var(--tec)} .k-lista{color:var(--henle)} .k-esc{color:var(--esc)} .k-ensayo{color:var(--pre)}
.phases{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.phase.now{border-color:var(--rep);box-shadow:0 0 0 1px var(--rep) inset}
.phase h3{font-size:1.15rem}
.phase .dates{font-size:.82rem;color:var(--muted);margin:2px 0 6px}
.months{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.month h3{font-size:1.1rem;margin-bottom:6px;text-transform:capitalize}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.grid7 .wd{font-size:.68rem;color:var(--muted);text-align:center;font-weight:700}
.dc{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--sheet);border-radius:6px;font-size:.78rem;display:grid;place-items:center;position:relative;padding:0;font-variant-numeric:tabular-nums}
.dc.empty{border:0;background:none}
.dc.k-cultura{background:var(--tint);color:var(--muted)}
.dc.k-corta{background:color-mix(in srgb,var(--ti) 14%,var(--sheet))}
.dc.k-concierto{background:var(--rep);color:var(--paper);border-color:var(--rep);font-weight:700}
.dc.k-examen{background:color-mix(in srgb,var(--tec) 22%,var(--sheet));border-color:var(--tec)}
.dc.k-descanso{background:none;border-style:dashed;color:var(--muted)}
.dc.k-vispera{border-color:var(--rep)}
.dc.today{outline:2px solid var(--ink);outline-offset:1px}
.dc .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--ok)}
.dc .dot.half{background:none;border:1.5px solid var(--ok);width:6px;height:6px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}

/* MAPA */
.pieces{display:grid;gap:14px}
.pc h3{font-size:1.3rem}
.pc .comp{color:var(--muted);font-size:.9rem}
.pc .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.secs{display:grid;gap:6px;margin-top:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.sb{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--sheet);text-align:left;font-size:.88rem}
.sb .lv{font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;color:var(--ink)}
.lv0{background:var(--lvl0)} .lv1{background:var(--lvl1)} .lv2{background:var(--lvl2)} .lv3{background:var(--lvl3)} .lv4{background:var(--lvl4)}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:10px}
.bar > i{display:block;height:100%;background:var(--lvl4)}
.tempo-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;font-size:.9rem}
.tempo-row input{width:90px}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700;color:var(--henle)}
.groups{display:grid;gap:8px;margin-top:8px}
.groups .g{font-size:.9rem;border-top:1px solid var(--line);padding-top:8px}

/* BIBLIOTECA */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.subtabs button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lib{display:grid;gap:12px;margin-top:14px}
.lib .card h3{font-size:1.2rem}
.lib .card .when{font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.lib .card.now{border-color:var(--esc)}
.prose p{margin:.6em 0;max-width:68ch}
.prose ul{padding-left:1.2em;max-width:68ch}
.facts{margin-top:8px;padding:10px 12px;background:var(--tint);border-radius:8px;font-size:.92rem}
.facts ul{margin:.3em 0 0;padding-left:1.1em}
.strat h4{margin:12px 0 2px;font-size:1rem}
.strat .o{color:var(--muted);font-size:.92rem}

/* DIARIO */
.entries{display:grid;gap:10px;margin-top:12px}
.entry .when{font-weight:700}
.entry p{margin:.3em 0 0;white-space:pre-wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.stat .n{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1}
.stat .l{font-size:.82rem;color:var(--muted)}

/* metrónomo y temporizador */
.sheet-panel{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sheet);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.12);padding:14px var(--gut) calc(14px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:grid;gap:12px}
.mhead{display:flex;justify-content:space-between;align-items:center}
.mbig{display:flex;align-items:center;justify-content:center;gap:14px}
.mbig .bpm{font-family:var(--f-display);font-size:3.6rem;font-weight:700;line-height:1;min-width:3ch;text-align:center;font-variant-numeric:tabular-nums}
.mbig .unit{font-size:1.3rem;color:var(--muted)}
.round{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:1.3rem;font-weight:700}
.beats{display:flex;justify-content:center;gap:8px;min-height:16px}
.beats i{width:14px;height:14px;border-radius:50%;background:var(--line);transition:transform .06s}
.beats i.on{background:var(--rep);transform:scale(1.25)}
.beats i.first.on{background:var(--tec)}
.mrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.mrow input[type=range]{width:100%}
.startstop{height:48px;border:0;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:700;padding:0 26px;font-size:1rem}
.fab{position:fixed;right:var(--gut);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:999px;background:var(--ink);color:var(--paper);height:52px;padding:0 18px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.timerbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:31;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.14);max-width:calc(100% - 32px)}
.timerbar .tt{font-family:var(--f-display);font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums}
.timerbar .tn{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,15,25,.45);display:grid;place-items:center;padding:var(--gut)}
.modal .card{max-width:640px;width:100%;max-height:86vh;overflow:auto}
.modal h2{font-size:1.5rem}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 12px;font-weight:700}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--warn)}
.rest{margin-top:30px;text-align:center;padding:30px 10px}
.rest .big{font-family:var(--f-hand);font-size:2.2rem;color:var(--henle)}
@media (max-width:560px){
  .blk{grid-template-columns:48px minmax(0,1fr);gap:0 12px}
  .ruler .t{font-size:.82rem}
  .tli{grid-template-columns:72px minmax(0,1fr)}
  .tli .left{grid-column:2}
  .brand span{display:none}
}

 en el escenario?","¿A quién le dedicas el concierto?"],"s":[]}],"readings":{"falla":{"t":"Manuel de Falla","sub":"Cádiz, 1876 – Alta Gracia (Argentina), 1946","p":["Falla nació en Cádiz, muy cerca de donde vives. De niño aprendió piano con su madre y en su casa se hacían conciertos. Soñaba con ser escritor, pero la música ganó.","Vivió varios años en París, donde conoció a Debussy y a Ravel. Allí descubrió que la música española podía ser moderna sin dejar de ser española.","Sus obras más famosas son «El amor brujo», «El sombrero de tres picos» y «Noches en los jardines de España». En «El amor brujo» aparece la «Danza ritual del fuego», una de las piezas españolas más tocadas del mundo.","Era muy perfeccionista: podía pasarse años revisando una obra. Al final de su vida se fue a Argentina, donde murió. Está enterrado en la catedral de Cádiz."],"c":["Estudió piano tan en serio que ganó un concurso de piano en Madrid.","El amor brujo cuenta la historia de Candela, una gitana a la que persigue el fantasma de su antiguo novio.","Falla y el poeta Lorca organizaron en 1922 un concurso de cante jondo en Granada para proteger el flamenco."]},"bach":{"t":"Johann Sebastian Bach","sub":"Eisenach (Alemania), 1685 – Leipzig, 1750","p":["Bach venía de una familia de músicos: durante generaciones, en su región la palabra «Bach» casi significaba «músico».","Se quedó huérfano a los 10 años y lo crió su hermano mayor. Cuenta una historia que copiaba de noche, a la luz de la luna, partituras que su hermano no le dejaba usar.","Trabajó como organista, como músico de corte y, los últimos 27 años de su vida, como cantor en Leipzig, donde tenía que componer música para la iglesia casi cada semana.","Tuvo 20 hijos y fue un gran profesor. Muchas de sus obras de teclado las escribió para enseñar a sus hijos y alumnos… como la Sinfonía que estás tocando."],"c":["Una vez caminó unos 400 km para escuchar al organista Buxtehude.","Durante casi un siglo tras su muerte se tocó poco; en 1829 Mendelssohn dirigió su Pasión según San Mateo y lo volvió a poner de moda.","Hoy es, probablemente, el compositor más admirado por los propios compositores."]},"sinfonias":{"t":"Las Invenciones y Sinfonías","sub":"Por qué existe la obra que tocas","p":["Bach escribió 15 Invenciones (a dos voces) y 15 Sinfonías (a tres voces). Las pasó a limpio en 1723 con un título larguísimo, como se hacía entonces.","En ese título explica para qué sirven: para aprender a tocar limpio a dos y tres voces, para aprender a inventar buenas ideas musicales y desarrollarlas, y, sobre todo, «para conseguir una manera cantable de tocar».","Fíjate: lo más importante para Bach no era la velocidad ni los dedos, sino cantar. Tu profe te dice que te falta cantar la música: el propio Bach está de acuerdo en que esa es la clave.","Por eso, cuando toques tu Sinfonía, piensa en tres cantantes: una soprano, una contralto y un bajo. Cada uno con su respiración y su frase."],"c":["Las escribió para su hijo mayor, Wilhelm Friedemann, y para sus alumnos.","Las 15 Sinfonías están en 15 tonalidades distintas.","Muchos pianistas famosos siguen tocándolas en conciertos toda su vida."]},"miedo":{"t":"El miedo escénico","sub":"Cómo convertir los nervios en energía","p":["Casi todos los músicos se ponen nerviosos antes de tocar, incluso los más famosos. Los nervios no son un fallo: son tu cuerpo preparándose para algo importante.","El corazón se acelera, las manos pueden sudar o enfriarse. Si lo has practicado (con el ejercicio del «corazón acelerado»), tu cuerpo lo reconoce y no se asusta.","Tres herramientas: 1) Respira: 4 segundos coges aire, 6 lo sueltas. Soltar despacio calma el corazón. 2) Piensa en la música, no en ti: en el primer compás cantado por dentro. 3) Ten un plan de rescate: si te pierdes, saltas al siguiente anclaje.","Y recuerda: el público quiere que te salga bien. Nadie está buscando tus errores. La mayoría ni los notará."],"c":["Muchos grandes pianistas cuentan que se ponían muy nerviosos antes de salir, y aun así daban conciertos maravillosos.","Un poco de nervios mejora la concentración; el truco es no luchar contra ellos.","Tocar muchas veces delante de otros (aunque sea la familia) es el mejor entrenamiento."]},"estudio":{"t":"¿Qué es un estudio?","sub":"Ejercicio y arte a la vez","p":["Un estudio es una obra que trabaja un problema técnico concreto: velocidad, octavas, arpegios, cantar una melodía entre otras notas…","Czerny escribió cientos, pensados para practicar. Chopin y Liszt dieron un paso más: estudios tan bonitos que se tocan en los conciertos.","Tus cuatro estudios trabajan cosas distintas: Jensen 10, energía y velocidad; Jensen 12, cantar sobre arpegios; Heller, melodía y acompañamiento en la misma mano; Czerny, velocidad y ligereza.","El secreto de un estudio es que, cuando ya lo dominas, nadie debería notar lo difícil que es. Solo debería oírse música."],"c":["La palabra viene del francés «étude».","Los 24 estudios de Chopin son de las obras más difíciles del repertorio.","Debussy escribió 12 estudios y dedicó uno a «los cinco dedos, según el señor Czerny»."]},"jensen":{"t":"Adolf Jensen","sub":"Königsberg, 1837 – Baden-Baden, 1879","p":["Jensen es poco conocido hoy, pero en su tiempo sus canciones (lieder) eran muy apreciadas.","Admiraba profundamente a Schumann y a Wagner. Su música de piano es romántica, llena de emoción y de color.","Sus 25 Estudios Op. 32 son piezas de carácter: cada uno tiene un título de tempo que es casi una emoción («furioso», «con duolo»).","Vivió poco (murió con 42 años) y trabajó como pianista y profesor en varias ciudades de Alemania."],"c":["Königsberg, su ciudad natal, hoy se llama Kaliningrado y es parte de Rusia.","Escribió más de 150 canciones.","Sus estudios siguen usándose en conservatorios porque son técnicos y muy musicales a la vez."]},"perianes":{"t":"Javier Perianes","sub":"Pianista, Nerva (Huelva), 1978","p":["Perianes es uno de los pianistas españoles más importantes de hoy. Es andaluz: nació en Nerva, un pueblo minero de Huelva.","Toca con las mejores orquestas del mundo y es famoso por su sonido delicado y por cómo toca la música española (Falla, Granados, Mompou).","Recibió el Premio Nacional de Música en 2012.","Este curso toca dos veces cerca de ti: en la Maestranza de Sevilla (21 de noviembre) y en el Villamarta con la Sinfónica de Sevilla (24 de abril)."],"c":["Empezó a tocar el piano de niño en su pueblo.","Ha grabado mucho para el sello Harmonia Mundi.","Fíjate en sus manos cuando toca pp: parece que acaricia el piano."]},"czerny":{"t":"Carl Czerny","sub":"Viena, 1791 – Viena, 1857","p":["Czerny fue alumno de Beethoven desde los 10 años. Beethoven lo tenía en tanta estima que le confió estrenar en Viena su Concierto «Emperador».","Fue el gran profesor de su época. Su alumno más famoso fue Franz Liszt, al que empezó a dar clase cuando Liszt era un niño.","Escribió más de mil obras. Sus colecciones de estudios (como la Op. 299, «Escuela de la velocidad», la de tu estudio) se siguen usando en todo el mundo.","Así que cuando estudias Czerny estás en una cadena: Beethoven → Czerny → Liszt → … → tu profe → tú."],"c":["Dejó por escrito cómo quería Beethoven que se tocaran sus obras.","Se cuenta que componía en varias mesas a la vez, pasando de una obra a otra.","Nunca se casó y vivió siempre en Viena."]},"heller":{"t":"Stephen Heller","sub":"Pest (Hungría), 1813 – París, 1888","p":["Heller nació en Hungría, fue niño prodigio del piano y acabó viviendo casi toda su vida en París.","Fue amigo de Chopin, de Liszt y de Berlioz, y escribía críticas musicales.","Sus estudios (Op. 45, 46 y 47) buscan algo especial: que el alumno aprenda técnica tocando música de verdad, bonita y expresiva, no ejercicios secos.","Por eso tu estudio se llama «Andante cantabile»: es un estudio para aprender a cantar con el piano."],"c":["Admiraba muchísimo a Schumann, que escribió elogios sobre él.","Sus estudios se usan en conservatorios de todo el mundo desde hace más de 150 años.","No le gustaba dar conciertos: prefería componer y enseñar."]},"beethoven":{"t":"Beethoven joven","sub":"Bonn, 1770 – Viena, 1827","p":["Cuando escribió tus Variaciones, Beethoven tenía unos 21 años y vivía todavía en Bonn, su ciudad natal. Se publicaron en 1793.","En noviembre de 1792 se mudó a Viena para estudiar con Haydn. Allí se hizo famoso como pianista… sobre todo como improvisador.","En aquella época los pianistas competían improvisando variaciones sobre temas conocidos, casi como un duelo. Beethoven era imbatible.","WoO significa «obra sin número de opus»: obras que Beethoven no numeró. Pero no son menos importantes: aquí ya se ve su humor, sus contrastes y sus sorpresas."],"c":["Su padre quería convertirlo en un niño prodigio como Mozart.","Empezó a perder el oído hacia los 28 años y aun así compuso sus obras más grandes.","Se cuenta que en un duelo de improvisación con el pianista Steibelt, tomó una partitura de su rival, le dio la vuelta y improvisó sobre ella."]},"variacion":{"t":"El arte de variar","sub":"Un tema y trece disfraces","p":["Tus Variaciones parten de una canción de una ópera cómica de Carl Ditters von Dittersdorf, «Das rote Käppchen» (algo así como «El gorrito rojo»). La canción empieza «Había una vez un viejo…».","Variar es como disfrazar el tema: lo puedes adornar con notas rápidas, pasar a la mano izquierda, cambiar el compás, ponerlo triste o convertirlo en una marcha.","Lo importante es que el tema siga ahí, reconocible debajo del disfraz. Intenta encontrarlo en cada variación.","Para tocarlas en concierto, piensa en cada variación como un personaje distinto de una misma historia. El público tiene que notar el cambio de personaje."],"c":["Mozart, Haydn, Beethoven y Brahms escribieron muchísimas variaciones.","Las Variaciones Goldberg de Bach son 30 variaciones sobre un aria.","Beethoven escribió más de 20 series de variaciones para piano."]},"tchaikovsky":{"t":"Piotr Ilich Tchaikovsky","sub":"Vótkinsk (Rusia), 1840 – San Petersburgo, 1893","p":["Tchaikovsky estudió Derecho y trabajó en un ministerio antes de dedicarse por completo a la música. Empezó a estudiarla en serio con 21 años.","Es el autor de los ballets más famosos del mundo: El lago de los cisnes, La bella durmiente y El cascanueces.","Su música es muy emocional y melódica: sabía escribir melodías que se quedan en la cabeza para siempre.","Viajó mucho: dirigió sus obras en Europa y en Estados Unidos, donde participó en la inauguración del Carnegie Hall de Nueva York en 1891."],"c":["Escribía cartas a una mecenas, Nadezhda von Meck, a la que nunca quiso conocer en persona.","De niño era tan sensible a la música que decía que no se la podía quitar de la cabeza.","Compuso Las Estaciones a la vez que El lago de los cisnes."]},"estaciones":{"t":"Las Estaciones: «Abril»","sub":"Una pieza para cada mes","p":["En 1876, una revista de música de San Petersburgo publicó cada mes una pieza para piano de Tchaikovsky: una por cada mes del año.","Cada pieza llevaba al principio unos versos de un poeta ruso. Los de «Abril» son de Apolón Máikov y dicen, más o menos:","«Campanilla azul y pura, y junto a ella los últimos copos de nieve. Las últimas lágrimas por las penas pasadas y los primeros sueños de otra felicidad.»","Esa es la imagen de tu obra: el final del invierno y la primera flor. Un poco de nostalgia y mucha esperanza. Tenlo en la cabeza cuando toques."],"c":["La campanilla de invierno es de las primeras flores que salen entre la nieve.","Las Estaciones se escribieron para aficionados que tocaban en casa.","Diciembre es un vals navideño; junio, una barcarola famosísima."]},"espanola":{"t":"Cómo elegir tu obra española","sub":"Cuatro candidatas","p":["Albéniz, «Tango» Op. 165 n.º 2 (de «España»): lento, elegante y con ritmo de habanera. Muy bonito para trabajar el rubato.","Granados, «Valses poéticos» (una selección): románticos y muy cantables. Ideales si te gustó Abril de Tchaikovsky.","Turina, «Niñerías»: piezas breves y llenas de carácter, muy andaluzas (Turina era sevillano).","Falla, «Serenata andaluza»: juvenil, con aire de guitarra. Y Falla es de Cádiz.","Escúchalas, elige tu favorita y coméntala con tu profe. La decisión final es suya, pero tu opinión cuenta."],"c":["Albéniz tocó en público desde muy niño.","Granados era un pianista extraordinario y fundó su propia academia en Barcelona.","Turina y Falla fueron muy amigos en París."]},"pedal":{"t":"El pedal","sub":"El alma del piano","p":["El pedal derecho levanta todos los apagadores: las cuerdas siguen sonando y vibrando con las demás. Por eso el sonido se vuelve más rico.","Pero si no se cambia a tiempo, las armonías se mezclan y el sonido se ensucia.","La técnica básica es el «pedal sincopado»: tocas la nota nueva, y justo después levantas y vuelves a bajar el pedal. Así unes sin manchar.","El mejor juez del pedal es tu oído. Anton Rubinstein, un gran pianista ruso, dijo que el pedal es el alma del piano."],"c":["Los primeros pianos tenían palancas para las rodillas en lugar de pedales.","El pedal izquierdo (una corda) cambia el color, no solo el volumen.","En Bach se usa muy poco pedal; en Tchaikovsky y Satie es parte del color."]},"fortepiano":{"t":"El piano de Beethoven","sub":"Un instrumento distinto al tuyo","p":["El piano de Beethoven (el «fortepiano») era más ligero que el tuyo: teclas más cortas, martillos de cuero, menos volumen y un sonido más claro.","Por eso sus sf y sus contrastes sonaban muy teatrales: el instrumento casi «se rompía» en los fuertes.","Tocar Beethoven en un piano moderno exige ligereza en los pasajes rápidos y claridad: si usas demasiado pedal o demasiado peso, se pierde el humor.","Edoardo Torbianelli, que toca el 31 de enero en el Villamarta, es especialista en estos instrumentos antiguos."],"c":["El primer piano lo inventó Bartolomeo Cristofori en Florencia hacia 1700.","Se llamaba «piano e forte» porque, a diferencia del clave, podía tocar suave y fuerte.","Beethoven pedía pianos cada vez más potentes a los constructores."]},"rubato":{"t":"Rubato: robar tiempo","sub":"La libertad que tiene reglas","p":["«Rubato» viene del italiano «rubare», robar. Es estirar un poco el tiempo en un sitio y recuperarlo en otro.","Un buen rubato es como hablar: cuando dices algo importante, haces una pequeña pausa; luego sigues con naturalidad.","Un mal rubato es cuando el pulso se pierde y el oyente ya no sabe dónde está.","Consejo: la mano izquierda suele mantener el pulso mientras la derecha canta con cierta libertad. En tu Abril, «un poco rubato» significa eso: poco."],"c":["Chopin es el compositor más asociado al rubato.","En Bach casi no se usa; en el Romanticismo es fundamental.","Escuchar a cantantes es la mejor escuela de rubato."]},"sonata":{"t":"¿Qué es una sonata?","sub":"El concierto de febrero","p":["Una sonata es una obra instrumental en varios movimientos (normalmente 3 o 4), con caracteres contrastados: rápido, lento, rápido.","En el Clasicismo (Haydn, Mozart, Beethoven) fue la forma más importante de la música de piano.","Tus variaciones no son una sonata, pero son del mismo mundo y del mismo Beethoven: equilibrio, claridad, contrastes y humor.","Beethoven escribió 32 sonatas para piano. Muchos pianistas dicen que son el «Nuevo Testamento» del piano (el «Antiguo» sería El clave bien temperado de Bach)."],"c":["La palabra viene del italiano «sonare», sonar: música para ser tocada, no cantada.","Algunas sonatas de Beethoven tienen apodo (Claro de luna, Patética, Appassionata) pero casi ninguno se lo puso él.","Haydn escribió más de 60 sonatas para teclado."]},"sokolov":{"t":"Grigory Sokolov","sub":"Pianista, Leningrado (hoy San Petersburgo), 1950","p":["Sokolov ganó el Concurso Chaikovski de Moscú con solo 16 años.","Es famoso por su sonido, por su concentración absoluta y por preparar un único programa de recital cada temporada, que toca por toda Europa.","Apenas da entrevistas: prefiere que hable la música.","Sus conciertos suelen terminar con muchas propinas (bises): a veces 5 o 6. El 7 de marzo toca en la Maestranza de Sevilla."],"c":["Toca con la sala casi a oscuras.","Ha grabado pocos discos de estudio: prefiere las grabaciones en directo.","Muchos pianistas jóvenes van a sus conciertos a aprender."]},"romanticismo":{"t":"El Romanticismo","sub":"La música de los sentimientos","p":["El Romanticismo es la época de la música que va más o menos de 1820 a 1900: Schubert, Schumann, Chopin, Liszt, Brahms, Tchaikovsky…","Los románticos querían expresar sentimientos intensos: nostalgia, pasión, naturaleza, sueños.","El piano se convirtió en el gran instrumento del Romanticismo: se hizo más grande y potente, y aparecieron las piezas breves de carácter, como tu Abril o tus estudios de Jensen.","Para tocar romántico: canta mucho, respira, usa el pedal como color y deja que el tiempo sea un poco flexible."],"c":["Muchos románticos escribían también poesía o crítica musical.","Liszt fue la primera superestrella: el público se desmayaba en sus conciertos.","La palabra «romántico» viene de las novelas («romances») medievales."]},"haydn_cadiz":{"t":"Haydn y Cádiz","sub":"Las siete últimas palabras de Cristo","p":["Hacia 1786, un canónigo de Cádiz encargó a Joseph Haydn, en Austria, una música para el Viernes Santo en el Oratorio de la Santa Cueva.","Haydn escribió siete movimientos lentos, uno para cada una de las siete palabras de Cristo en la cruz, más una introducción y un final que imita un terremoto.","Contó que escribir siete adagios seguidos sin aburrir al público fue una de sus tareas más difíciles.","La obra existe para orquesta, para cuarteto de cuerda, como oratorio y también en versión para piano."],"c":["La Santa Cueva sigue en pie en Cádiz y se puede visitar.","Haydn era el profesor de Beethoven cuando este llegó a Viena.","El final se llama «Il terremoto» (El terremoto)."]},"satie":{"t":"Erik Satie","sub":"Honfleur (Francia), 1866 – París, 1925","p":["Satie fue un compositor raro y genial. Vivía en París, tocaba el piano en cabarets de Montmartre y escribía una música sencilla y extraña a la vez.","Inventó la palabra «Gnossienne» para sus piezas: nadie sabe con seguridad qué significa.","En sus partituras escribía indicaciones curiosas en lugar de las normales. En tu Gnossienne 5 solo pone «souple et expressif» (flexible y expresivo).","Tu Gnossienne n.º 5 está fechada el 8 de julio de 1889, pero se publicó muchos años después de su muerte."],"c":["Coleccionaba paraguas y tenía siete trajes de terciopelo iguales.","Era amigo de Debussy, al que influyó mucho.","Tiene una pieza, «Vexations», que según su indicación se repite 840 veces."]},"albeniz":{"t":"Isaac Albéniz","sub":"Camprodon (Girona), 1860 – Cambo-les-Bains (Francia), 1909","p":["Albéniz fue un niño prodigio del piano: dio conciertos siendo muy pequeño y viajó por medio mundo como pianista.","Su gran obra es «Iberia»: 12 piezas en 4 cuadernos que retratan España, sobre todo Andalucía.","Dos de ellas hablan de lugares que conoces: «El Puerto» (El Puerto de Santa María) y «Jerez».","Iberia es de las obras más difíciles del repertorio. Albéniz llegó a pensar en destruir alguna pieza porque creía que nadie podría tocarla."],"c":["Alicia de Larrocha es la pianista más asociada a Iberia.","Albéniz vivió en París y fue amigo de Debussy y de Dukas.","Su «Asturias» es famosísima en versión para guitarra."]},"granados":{"t":"Enrique Granados","sub":"Lleida, 1867 – Canal de la Mancha, 1916","p":["Granados fue un pianista extraordinario y un gran profesor: fundó una academia de piano en Barcelona.","Su obra más famosa es «Goyescas», inspirada en los cuadros de Goya. En «Quejas o la maja y el ruiseñor», el piano imita el canto de un pájaro.","También escribió «Danzas españolas» y «Valses poéticos».","Murió trágicamente en 1916, cuando volvía del estreno de su ópera Goyescas en Nueva York: su barco fue torpedeado en el Canal de la Mancha."],"c":["Improvisaba maravillosamente al piano.","La academia que fundó (después llamada Academia Marshall) formó a Alicia de Larrocha.","Su Danza española n.º 5 «Andaluza» es muy popular también en guitarra."]},"bruceliu":{"t":"Bruce Liu","sub":"Pianista, París, 1997","p":["Bruce Liu nació en París, de familia china, y creció en Canadá.","En 2021 ganó el Concurso Internacional de Piano Chopin de Varsovia, uno de los concursos más difíciles y prestigiosos del mundo, que solo se celebra cada 5 años.","Es conocido por su forma de tocar clara, elegante y con mucho brillo.","El 7 de mayo toca en la Maestranza de Sevilla."],"c":["Estudió en Montreal con Dang Thai Son, que también ganó el Concurso Chopin (en 1980).","Tocó en la final del concurso el Concierto n.º 1 de Chopin.","Ha grabado también música de Rameau, un compositor barroco francés."]},"memoria":{"t":"Cómo funciona la memoria musical","sub":"Cuatro memorias mejor que una","p":["Cuando tocas de memoria usas varias memorias a la vez: la de los dedos (movimiento), la del oído (cómo suena), la visual (cómo es la partitura o el teclado) y la analítica (qué está pasando en la música).","La de los dedos es rápida pero traicionera: con nervios falla. Por eso en el plan hay ejercicios como tocar lento de memoria o «tocar» en la tapa: obligan a usar las otras memorias.","Los anclajes son puntos seguros desde los que puedes reengancharte siempre.","Y un secreto: la memoria se asienta durmiendo. Estudiar un poco cada día funciona mucho mejor que mucho un solo día."],"c":["Clara Schumann fue de las primeras pianistas en tocar de memoria en público, en el siglo XIX.","Imaginar que tocas (práctica mental) activa casi las mismas zonas del cerebro que tocar de verdad.","Repasar algo justo antes de dormir ayuda a recordarlo."]},"breton":{"t":"Tomás Bretón","sub":"Salamanca, 1850 – Madrid, 1923","p":["Bretón fue compositor, director de orquesta y violinista. Empezó tocando en orquestas de teatro con solo 10 años.","Su obra más famosa es la zarzuela «La verbena de la Paloma», que sucede en una fiesta popular de Madrid.","También escribió música sinfónica, como «En la Alhambra», y música de cámara, como tríos con piano.","La zarzuela es el teatro musical español: mezcla partes habladas y cantadas."],"c":["Dirigió el Conservatorio de Madrid.","La verbena de la Paloma se estrenó en 1894.","Defendió toda su vida que España tuviera ópera propia."]},"mompou":{"t":"Federico Mompou","sub":"Barcelona, 1893 – Barcelona, 1987","p":["Mompou escribió casi solo para piano: piezas breves, íntimas y muy sencillas en apariencia.","Admiraba a Satie. Como él, buscaba decir mucho con muy pocas notas.","Sus «Cançons i danses» combinan una canción lenta con una danza, casi siempre sobre melodías populares catalanas.","Su «Música callada» es música para escuchar en silencio, casi como una oración."],"c":["La familia de su madre tenía una fundición de campanas: el sonido de las campanas está en su música.","Era muy tímido y casi no daba conciertos.","Alicia de Larrocha y Perianes lo han tocado mucho."]}},"sight":[{"d":"2026-10-01","t":"Cuaderno de Ana Magdalena Bach (1725)","lk":[{"t":"PDF directo (21 piezas, ed. Gouin)","u":"https://s9.imslp.org/files/imglnks/usimg/5/58/IMSLP582238-PMLP06107-AMBach_21_Extraits.pdf"},{"t":"Página en IMSLP","u":"https://imslp.org/wiki/Notebooks_for_Anna_Magdalena_Bach_(Bach,_Johann_Sebastian)"}]},{"d":"2026-11-01","t":"Schumann · Álbum para la juventud, Op. 68","lk":[{"t":"Partitura en IMSLP","u":"https://imslp.org/wiki/Album_f%C3%BCr_die_Jugend,_Op.68_(Schumann,_Robert)"}]},{"d":"2026-12-01","t":"Tchaikovsky · Álbum para la juventud, Op. 39","lk":[{"t":"Partitura en IMSLP","u":"https://imslp.org/wiki/Children's_Album,_Op.39_(Tchaikovsky,_Pyotr)"}]},{"d":"2027-01-11","t":"Bartók · Para niños (vol. 1)","lk":[{"t":"Partitura en IMSLP","u":"https://imslp.org/wiki/For_Children,_Sz.42_(Bart%C3%B3k,_B%C3%A9la)"}]},{"d":"2027-02-01","t":"Clementi · Sonatinas Op. 36","lk":[{"t":"Partitura en IMSLP","u":"https://imslp.org/wiki/6_Piano_Sonatinas,_Op.36_(Clementi,_Muzio)"}]},{"d":"2027-03-01","t":"Burgmüller · 25 estudios fáciles, Op. 100","lk":[{"t":"Partitura en IMSLP","u":"https://imslp.org/wiki/25_%C3%89tudes_faciles_et_progressives,_Op.100_(Burgm%C3%BCller,_Friedrich)"}]},{"d":"2027-04-01","t":"Heller · 25 estudios, Op. 47 (de la familia de tu estudio)","lk":[{"t":"Partitura en IMSLP","u":"https://imslp.org/wiki/25_Etudes,_Op.47_(Heller,_Stephen)"}]},{"d":"2027-05-01","t":"Granados · Cuentos de la juventud, Op. 1","lk":[{"t":"Partitura en IMSLP","u":"https://imslp.org/wiki/Cuentos_de_la_juventud,_Op.1_(Granados,_Enrique)"}]},{"d":"2027-05-27","t":"Corales de Bach (a 4 voces)","lk":[{"t":"Partitura en IMSLP","u":"https://imslp.org/wiki/371_Vierstimmige_Choralges%C3%A4nge_(Bach,_Johann_Sebastian)"}]}],"events":[{"d":"2026-10-02","k":"esc","t":"Villamarta · Falla: El amor brujo y La vida breve","x":"20:00. También el domingo 4."},{"d":"2026-10-04","k":"esc","t":"Villamarta · Falla: El amor brujo y La vida breve","x":"20:00"},{"d":"2026-10-13","k":"lista","t":"Bach listo (15 días antes del concierto)","x":"De memoria y preparado para el escenario."},{"d":"2026-10-28","k":"concierto","t":"Concierto Barroco","x":"19:00 · Sala Compañía · Bach, Sinfonía n.º 12"},{"d":"2026-11-11","k":"lista","t":"Estudio de concierto listo","x":"15 días antes del concierto."},{"d":"2026-11-21","k":"esc","t":"Maestranza (Sevilla) · Javier Perianes, piano","x":"20:00"},{"d":"2026-11-26","k":"concierto","t":"Concierto de Estudios","x":"19:00 · Sala Compañía"},{"d":"2026-12-07","k":"lista","t":"Beethoven listo","x":"15 días antes del concierto clásico."},{"d":"2026-12-09","k":"examen","t":"Exámenes de piano (1er trimestre)","x":"Del 9 al 15 de diciembre."},{"d":"2026-12-22","k":"concierto","t":"Concierto Clásico","x":"18:30 · Claustros de Santo Domingo · Beethoven"},{"d":"2027-01-31","k":"esc","t":"Villamarta · Edoardo Torbianelli, piano","x":"18:00"},{"d":"2027-02-01","k":"lista","t":"Beethoven listo para el concierto de Sonata","x":"15 días antes."},{"d":"2027-02-05","k":"es izar"],["2026-10-19","Asegurar y hacer música"],["2026-11-21","Pulir"],["2026-12-16","Mantener"]],"czerny15":[["2026-10-01","Lectura"],["2026-10-26","Memorizar"],["2026-11-16","Asegurar y ganar tempo"],["2026-11-27","Ganar tempo"],["2026-12-16","Mantener"]],"beeth":[["2026-10-01","Memorizar"],["2026-11-01","Asegurar y hacer música"],["2026-11-27","De principio a fin"],["2026-12-08","Modo concierto"],["2026-12-23","Mantener"],["2027-01-11","Pulir"],["2027-02-01","Modo concierto"],["2027-02-17","Mantener"]],"tchaik":[["2026-10-01","Mantener la lectura"],["2026-12-16","Lectura"],["2026-12-23","Memorizar"],["2027-01-18","Asegurar y hacer música"],["2027-02-22","Pulir"],["2027-03-04","Modo concierto"],["2027-03-19","Mantener"]],"satie":[["2026-10-01","Mantener la lectura"],["2027-02-01","Memorizar"],["2027-03-29","Asegurar y hacer música"],["2027-04-26","Pulir"],["2027-05-12","Modo concierto"],["2027-05-27","Mantener"]],"esp":[["2026-10-01","Pendiente"],["2027-01-11","Lectura"],["2027-02-08","Memorizar"],["2027-03-22","Asegurar y hacer música"],["2027-04-26","Pulir"],["2027-05-12","Modo concierto"],["2027-05-27","Mantener"]]},"T":["Jueves de cultura musical","Hoy no toca piano: toca escuchar, leer y conocer la música por dentro.","Escucha de la semana","Falla: El amor brujo y La vida breve","El 2 y el 4 de octubre se representan en el Teatro Villamarta. Falla nació en Cádiz: es música de tu tierra.","Escucha: «Danza ritual del fuego» (El amor brujo); «Danza española n.º 1» (La vida breve).","Pregunta: ¿Qué instrumentos oyes en la Danza ritual del fuego?","Pregunta: ¿Qué ritmo se repite todo el rato? Intenta marcarlo con la mano.","Pregunta: ¿Qué tiene de andaluz esta música?","Falla Danza ritual del fuego","Falla La vida breve Danza española 1","No. Solo escucha, con atención.","Has contestado las preguntas en tu diario.","Manuel de Falla","Conocer a quién y qué hay detrás de la música.","Lee la ficha «Manuel de Falla» en la Biblioteca.","Cuéntale a alguien de casa una de las curiosidades.","Recuerdas una curiosidad.","Práctica mental (opcional)","Estudiar sin piano: la memoria también se entrena con la imaginación.","Con la partitura de Bach delante, recorre un trozo en tu cabeza: oye cada nota y ve tus dedos.","Luego cierra los ojos e inténtalo sin mirar.","Lo que no consigas imaginar, míralo el viernes en el piano.","No. Hoy trabaja la memoria sin prisa, con tu propio pulso.","Has recorrido un trozo entero en tu cabeza.","Hoy es jueves y no hay piano: empieza el curso escuchando a Falla, que se representa mañana en el Villamarta. Mañana viernes, primera sesión: el diagnóstico. Cómo funciona: cada día abre «Hoy» y sigue los bloques en orden; cada bloque dice su objetivo, sus minutos, si va con metrónomo y cómo saber si lo has conseguido.","Día 1 · Tu punto de partida","Hoy no se trata de estudiar mucho, sino de saber dónde estás. Vas a pintar tu mapa.","Velocidad por impulsos","La mayor · fa# menor","Velocidad sin tensión: la mano piensa en grupos, no nota a nota.","Escala de La mayor: toca grupos de 4 notas muy rápidos y para en la primera del siguiente grupo. Relaja en cada parada.","Luego grupos de 8. Luego una octava entera de golpe.","Haz lo mismo con los 5 dedos (do-re-mi-fa-sol y vuelta) en La mayor: como un relámpago y parada.","4 notas por pulso. Si sale limpio y relajado, prueba 4 más; si no, baja hasta que salga.","Los grupos salen rápidos y la mano está suelta en cada parada.","Si en la academia te han mandado Hanon esta semana, hazlo aquí, pero nunca igual dos veces: p, f, crescendo, staccato, ritmos o en otra tonalidad.","Tu punto de partida","todo el programa","Saber exactamente dónde estás en cada obra. Con eso, el plan es tuyo.","Abre la pestaña «Mapa».","Toca cada obra (o cada variación de Beethoven) de memoria, sin partitura. Un minuto por trozo basta.","Pinta cada sección con su color: sin leer · leída · casi de memoria · de memoria · lista para concierto.","Sé sincera: el mapa es solo para ti, y sirve para que el plan te ayude donde más lo necesitas.","Todas las secciones de tu mapa tienen color.","Tu tempo de salida","toda la Sinfonía","Encontrar el tempo al que Bach te sale perfecto hoy. De ahí saldremos hacia el concierto.","Metrónomo a ♩ = 50 (tu ♪ = 100 de ahora). Toca la Sinfonía de memoria.","Si sale limpia, sube a 52 y repite. Sigue subiendo de 2 en 2 hasta que aparezca el primer error.","Tu tempo de salida es el último que salió limpio. Anótalo en el mapa.","Sube de 2 en 2 mientras salga limpio.","Tienes anotado tu tempo de salida.","Tu primera línea","Terminar el primer día con algo que te guste.","Toca algo que te guste, lo que quieras.","Diario: ¿qué obra te apetece más este curso? ¿Cuál te da más miedo?","Has disfrutado.","Barroco en escena","Cómo funciona: cada día, abre «Hoy» y sigue los bloques en orden. Cada bloque dice su objetivo, cuántos minutos, si va con metrónomo y cómo saber si lo has conseguido.","Villamarta · Falla: El amor brujo y La vida breve","20:00. También el domingo 4.","Sesión de sábado","Lo más importante hoy: Bach — tocar la 1ª página sin errores de forma fiable, no de casualidad.","Movimiento contrario y récord","Coordinar las dos manos y medir tu progreso.","Escala de La mayor en movimiento contrario (las manos se separan desde el centro y vuelven).","Escala de La mayor en terceras (una mano empieza una tercera más arriba), 2 octavas.","Récord de la semana: escala de La mayor, 4 octavas, al tempo más rápido al que salga limpia. Anótalo en el diario.","Has anotado tu récord de la semana.","Cuaderno de Ana Magdalena Bach (1725)","Minueto en Sol, BWV Anh. 114","Leer algo nuevo cada día sin pararte. Leer bien es la llave para aprender obras más rápido.","Hoy: Cuaderno de Ana Magdalena Bach (1725), Minueto en Sol, BWV Anh. 114.","30 segundos de explorar ANTES de tocar: tonalidad, compás, dibujos que se repiten, primera posición de las manos.","Metrónomo lento. El metrónomo no espera: si fallas, sigue. Nunca pares ni corrijas.","Mira siempre un poco por delante de lo que tocas.","El metrónomo no espera: si fallas, sigue adelante.","Has llegado al final sin parar, aunque haya habido errores.","PDF directo (21 piezas, ed. Gouin)","https://s9.imslp.org/files/imglnks/usimg/5/58/IMSLP582238-PMLP06107-AMBach_21_Extraits.pdf","Página en IMSLP","https://imslp.org/wiki/Notebooks_for_Anna_Magdalena_Bach_(Bach,_Johann_Sebastian)","Tocar la 1ª página sin errores de forma fiable, no de casualidad.","Pon el metrónomo a un tempo al que la 1ª página te salga perfecto.","Toca la 1ª página 3 veces seguidas sin NINGÚN error. Si fallas, el contador vuelve a cero.","Cuando lo consigas, sube el metrónomo 4 y repite.","Consigues 3 seguidas limpias al menos a ♩ = 54.","Tres voces independientes: cada una con su propio fraseo.","Puntos de anclaje","el Tema y las Var. I y II","Crear en el Tema y las Var. I y II puntos seguros desde los que puedas empezar siempre de memoria.","Marca en el Tema y las Var. I y II 2 o 3 anclajes (comienzos de frase o cambios importantes) con un número dentro de un círculo.","Toca desde cada anclaje sin partitura, hasta el siguiente.","Regla de oro para el concierto: si te pierdes, saltas al siguiente anclaje y sigues.","Empiezas desde cualquier anclaje del Tema y las Var. I y II sin mirar.","Tema: cántalo con la letra que te inventes («Había una vez un viejo…»). Frases de 4 compases; el eco «p» que marcó tu profe.","Var. I: las semicorcheas de la derecha ligeras y perladas; la melodía del tema está escondida dentro, búscala.","Var. II: ahora las semicorcheas son de la izquierda. Izquierda sola muchas veces; los fp, claros.","Digitación primero","la mitad de arriba de la 1ª página","Fijar una digitación para la mitad de arriba de la 1ª página. Un dedo distinto cada vez es un error garantizado en el futuro.","Mano derecha sola, muy lento, pensando el número de cada dedo.","Escribe a lápiz las digitaciones que falten o que cambies.","Mano izquierda sola, igual.","Termina tocando la mitad de arriba de la 1ª página manos separadas 2 veces sin parar.","Usas siempre los mismos dedos en la mitad de arriba de la 1ª página.","Dedos cerca de la tecla y pulgar ligero, que no golpee.","Mantener y mejorar","Que el piano cante la 1ª página como lo cantarías tú.","Canta en voz alta (aunque sea bajito) la melodía de la 1ª página.","Respira donde respirarías cantando y marca esas respiraciones con una coma (’) en la partitura.","Tócala intentando que el piano respire en los mismos sitios.","¿Cuál es la nota más importante de cada frase? Que sea la cumbre.","No. Hoy manda tu oído: pulso interior y música.","Cada frase tiene una dirección y una cumbre, y se oyen las respiraciones.","Cada arranque de semicorcheas es un solo gesto de brazo, del grave al agudo.","Que no se olvide","Mantener la lectura","la sección A (1ª página)","Mantener viva la lectura de Tchaikovsky. Todavía no toca memorizarla: solo disfrutarla y que no se olvide.","Toca la sección A (1ª página) con partitura, despacio, disfrutando del sonido.","No corrijas mucho: si algo falla, repítelo una vez bien y sigue.","Termina escuchando mentalmente cómo sonará cuando esté lista: Allegretto con moto e un poco rubato. Una flor azul que asoma entre los últimos copos de nieve.","Has tocado la sección A (1ª página) sin pararte.","La melodía de la derecha canta por encima de los acordes.","Terminar la semana con algo que te apetezca.","Elige: improvisar, sacar algo de oído o tocar tu obra favorita del programa.","Diario: escribe una línea sobre lo que mejor te ha salido hoy.","Sesión larga de domingo","Lo más importante hoy: Bach — oír las tres voces como tres cantantes distintos. Bach escribió estas obras para aprender «una manera cantable de tocar».","Sonido: peso y canto","Aprender a producir un sonido bonito. Esto es lo que hace musical a un pianista.","Nota larga: deja caer el peso del brazo sobre una tecla desde 2 cm, con cada dedo. Escucha el sonido hasta que desaparezca. Luego 5 notas legato en La mayor pasando el peso de un dedo a otro, como quien camina.","Oyes la diferencia entre un sonido golpeado y un sonido con peso.","Minueto en sol menor, BWV Anh. 115","Hoy: Cuaderno de Ana Magdalena Bach (1725), Minueto en sol menor, BWV Anh. 115.","Voces por parejas","Oír las tres voces como tres cantantes distintos. Bach escribió estas obras para aprender «una manera cantable de tocar».","Toca solo la voz de arriba + el bajo (sin la voz del medio).","Luego la voz del medio + el bajo.","Luego las dos voces de arriba.","Al final, las tres: ¿sigues oyendo a cada una?","Puedes seguir con el oído cualquiera de las tres voces.","Cada entrada del tema debe oírse como un personaje que entra en escena.","Capas de memoria","las Var. III y IV","Memorizar cada mano por separado en las Var. III y IV. La mano izquierda es la que se olvida primero en el escenario.","Mano izquierda sola de memoria (sí, sola).","Mano derecha sola de memoria.","Manos juntas de memoria.","Si una mano no sale sola, esa es la que te falta de verdad: dale 2 minutos más.","Tocas cada mano sola de memoria en las Var. III y IV.","Var. III: tresillos cómodos y tranquilos, como su nombre (commodetto); los sf-p con elegancia, sin brusquedad.","Var. IV: trinos cortos y relajados (empiezan con la mano suelta); la izquierda en semicorcheas regulares como un reloj.","Entender lo que tocas","Descubrir cómo está hecha la mitad de arriba de la 1ª página: patrones, escalas, acordes. Lo que entiendes se aprende el doble de rápido.","Busca en la mitad de arriba de la 1ª página los dibujos que se repiten (secuencias, escalas, arpegios) y enciérralos a lápiz.","¿En qué tonalidad estás? ¿Dónde cambia? Escríbelo encima del compás.","Toca la armonía en acordes (bajo + acorde) para oír el esqueleto.","Ahora toca la mitad de arriba de la 1ª página normal, lento, pensando en lo que has descubierto.","Solo al final: una pasada con metrónomo para comprobar que el pulso no se ha escapado.","Puedes explicar con tus palabras cómo está construido este fragmento.","La izquierda (bajo + acorde) muy ligera: acompaña, no compite.","Crear en la 1ª página puntos seguros desde los que puedas empezar siempre de memoria.","Marca en la 1ª página 2 o 3 anclajes (comienzos de frase o cambios importantes) con un número dentro de un círculo.","Empiezas desde cualquier anclaje de la 1ª página sin mirar.","La melodía (dedos 4 y 5) suena clara; las semicorcheas del medio, susurradas.","Escalera de metrónomo","Subir la velocidad de la 2ª página sin perder limpieza.","Empieza a ♪ = 100. Si sale limpio y relajado, sube 4.","Si falla, baja 8 y vuelve a subir.","Hoy no pases de ♪ = 132.","Anota en tu mapa el tempo más rápido al que te ha salido limpio.","Tocas la 2ª página limpio a ♪ = 126.","Fuerte no es duro: sonido lleno, muñeca libre.","Concierto en casa","Tocar para otros sin presión. Es el mejor entrenamiento para el escenario.","Invita a alguien de casa (o haz una videollamada).","Programa de hoy: la obra del programa que mejor te sepa. Y, si quieres, algo más que te guste.","Presenta cada obra en una frase antes de tocarla. Pase lo que pase, sigue hasta el final y saluda.","No. En el escenario no hay metrónomo: el pulso lo llevas tú.","Has tocado sin parar y has saludado.","Inventar música tuya. No hay errores posibles.","Pregunta y respuesta: toca una frase de 4 compases en La mayor que «pregunte» (termina en la dominante) y contéstala con otra que termine en casa.","Si te gusta lo que sale, grábalo.","Sesión de lunes","Lo más importante hoy: Bach — encontrar las grietas de la memoria de la 1ª página. Tocar lento de memoria es la prueba más difícil: los dedos ya no te ayudan.","Escalas con intención","Igualdad y control en la escala de La mayor y fa# menor: todas las notas como perlas del mismo tamaño.","Escala de La mayor, 4 octavas, manos juntas.","Ronda 1: legato y p. Ronda 2: crescendo al subir y diminuendo al bajar.","Ronda 3: ritmo con puntillo (larga-corta). Ronda 4: al revés (corta-larga).","Ronda 5: normal. Repite con fa# menor (menor armónica).","3 veces seguidas sin tropiezos y con los hombros sueltos.","Minueto en Sol, BWV Anh. 116","Hoy: Cuaderno de Ana Magdalena Bach (1725), Minueto en Sol, BWV Anh. 116.","Lento de memoria","Encontrar las grietas de la memoria de la 1ª página. Tocar lento de memoria es la prueba más difícil: los dedos ya no te ayudan.","Toca la 1ª página de memoria a medio tempo.","Donde dudes, pon una marca a lápiz: es una grieta.","Repara cada grieta con la partitura (3 veces bien) y vuelve a probar.","Tocas la 1ª página lento y de memoria sin ninguna duda.","Articulación clara y ligera: la articulación es la sonrisa de Bach.","Mira, cierra, toca","las Var. V (con el Arioso) y VI","Pasar las Var. V (con el Arioso) y VI de la partitura a tu cabeza, 2 compases cada vez.","Mira 2 compases durante 30 segundos y cántalos por dentro.","Cierra la partitura (o dale la vuelta) y tócalos.","Si fallas, vuelve a mirar SOLO el compás del error.","Encadena: 2 + 2 compases, luego 4 + 4.","Tocas las Var. V (con el Arioso) y VI de memoria, lento, sin mirar.","Var. V: decidida. Los sf y tenuto con peso de brazo. El Arioso (Andante con moto) es un aria de ópera: canta.","Var. VI: la más cantabile. Legato total y dinámica de voz humana; el rallentando y calando final, como quien se duerme. Sin metrónomo.","Manos juntas por bloques","Juntar las manos en la mitad de arriba de la 1ª página sin errores, poco a poco.","Divide la mitad de arriba de la 1ª página en bloques de 2 compases.","Cada bloque: 3 veces seguidas sin error. Entonces pasas al siguiente.","Si fallas dos veces seguidas, baja 10 el metrónomo.","Al final, encadena todos los bloques.","Tocas la mitad de arriba de la 1ª página manos juntas y sin paradas a ♩ = 50.","Velocidad = claridad + relajación. Nunca más rápido de lo que puedes tocar limpio.","La nota de arriba de los acordes de la derecha es la melodía: que cante por encima.","Improvisa con solo 5 notas (do-re-mi-fa-sol) y la izquierda tocando do y sol juntos. Cambia de carácter a mitad: de alegre a misterioso.","Práctica mental (5')","En la cama o en el coche: recorre Bach en tu cabeza con los ojos cerrados, oyendo cada nota y viendo tus dedos. Si te pierdes, al día siguiente mira ese sitio en la partitura.","Sesión de martes","Lo más importante hoy: Bach — ganar velocidad de forma segura alternando tempos.","Arpegios y acordes","Pasar el pulgar sin baches y colocar acordes que suenen redondos.","Arpegio de La mayor (acorde de tónica): 2 octavas manos separadas, luego 4 octavas manos juntas.","Acordes de La mayor en posición fundamental y sus 2 inversiones, subiendo y bajando.","Cadencia I–IV–V7–I en La mayor y en fa# menor: haz que la nota de arriba suene más, como una melodía.","4 notas por pulso (o 3 si haces tresillos). Sin prisa en el paso del pulgar.","El paso del pulgar no se oye y la nota de arriba de los acordes canta.","Polonesa en Fa, BWV Anh. 117a","Hoy: Cuaderno de Ana Magdalena Bach (1725), Polonesa en Fa, BWV Anh. 117a.","Ganar velocidad de forma segura alternando tempos.","Toca la 2ª página una vez a ♩ = 44 (lento y perfecto).","Una vez a ♩ = 56.","Una vez a ♩ = 60, un poco más rápido de lo que puedes: sin miedo a fallar.","Vuelve a ♩ = 56: ahora parecerá fácil.","A ♩ = 56 te sientes cómoda y con control.","Estudia lento (tu profe lo pidió): la velocidad llega sola cuando todo está claro.","Memoria de analista","las Var. VII y VIII","Tener un mapa mental de las Var. VII y VIII: si sabes qué pasa, no se te olvida.","Di en voz alta la estructura de las Var. VII y VIII: «4 compases de pregunta, 4 de respuesta, luego una secuencia que baja…».","Nombra las tonalidades o acordes principales y escríbelos a lápiz.","Toca de memoria siguiendo ese mapa en la cabeza.","Puedes contar el mapa de las Var. VII y VIII sin mirar la partitura.","Var. VII: semicorcheas en 6/8 como un arroyo; la izquierda marca el compás en 2 (dos pulsos por compás).","Var. VIII: dolce y legato siempre. Estúdiala a veces sin pedal para cuidar el legato de los dedos.","la mitad de abajo de la 1ª página","Fijar una digitación para la mitad de abajo de la 1ª página. Un dedo distinto cada vez es un error garantizado en el futuro.","Termina tocando la mitad de abajo de la 1ª página manos separadas 2 veces sin parar.","Usas siempre los mismos dedos en la mitad de abajo de la 1ª página.","Memorizar cada mano por separado en la 2ª página. La mano izquierda es la que se olvida primero en el escenario.","Tocas cada mano sola de memoria en la 2ª página.","Legato en la melodía aunque haya notas en medio.","Lo que tú quieras","Tocar por el placer de tocar.","Toca algo que te guste: una obra antigua, una canción, una banda sonora…","Miércoles: sesión corta","Hoy solo hay 20 minutos: van enteros a lo más urgente. Lo más importante hoy: Bach — que cada entrada del tema se oiga como un personaje que entra en escena.","Calentamiento exprés","Despertar las manos en 4 minutos.","Escala y arpegio de la semana, manos juntas, lentos y con buen sonido.","Sin prisa: solo calentar.","No hace falta hoy.","Manos calientes y sueltas.","Que cada entrada del tema se oiga como un personaje que entra en escena.","Busca todas las entradas del tema y márcalas con un color.","Toca solo las entradas (salta de una a otra): ¿en qué voz está cada una?","Toca la obra entera haciendo que cada entrada se note un poco más.","Alguien que te escuche podría contar las entradas del tema.","Una línea en el diario","Cerrar la sesión sabiendo qué has conseguido.","Escribe en el diario qué ha salido mejor hoy.","Has escrito tu línea.","Tu Sinfonía de Bach, por tres pianistas","Comparar versiones es la mejor forma de descubrir qué quieres hacer tú.","Escucha: Sinfonía n.º 12 BWV 798: András Schiff; Glenn Gould; Angela Hewitt.","Pregunta: ¿Quién va más rápido? ¿Quién más lento?","Pregunta: ¿Quién separa más las notas (articulación)?","Pregunta: ¿Cuál te gusta más y por qué? Escríbelo en el diario.","Bach Sinfonia 12 BWV 798 Schiff","Bach Sinfonia 12 BWV 798 Gould","Bach Sinfonia 12 BWV 798 Hewitt","Johann Sebastian Bach","Lee la ficha «Johann Sebastian Bach» en la Biblioteca.","Sesión de viernes","Lo más importante hoy: Bach — poder empezar la 2ª página desde cualquier punto. Así nunca te quedas en blanco.","Minueto en Si♭, BWV Anh. 118","Hoy: Cuaderno de Ana Magdalena Bach (1725), Minueto en Si♭, BWV Anh. 118.","El dado de anclajes","Poder empezar la 2ª página desde cualquier punto. Así nunca te quedas en blanco.","Pulsa el dado (abajo) para que elija un anclaje al azar.","Empieza desde ahí de memoria y toca hasta el siguiente anclaje.","Aciertas las 6 tiradas sin mirar.","Cadena hacia atrás","las Var. IX y X","Que el final de las Var. IX y X (lo que peor se suele saber) sea lo más seguro.","Memoriza la ÚLTIMA frase de las Var. IX y X.","Después la penúltima + la última.","Así hasta el principio: cada vez llegas a terreno conocido.","El final de las Var. IX y X te sale igual de seguro que el principio.","Var. IX: energía y humor; ff y p repentinos. El Andantino del medio es un contraste total: de golpe, calma.","Var. X: los tenuto son notas con peso, sin golpear; los adornos, siempre a tiempo.","Descubrir cómo está hecha la mitad de abajo de la 1ª página: patrones, escalas, acordes. Lo que entiendes se aprende el doble de rápido.","Busca en la mitad de abajo de la 1ª página los dibujos que se repiten (secuencias, escalas, arpegios) y enciérralos a lápiz.","Ahora toca la mitad de abajo de la 1ª página normal, lento, pensando en lo que has descubierto.","Los arpegios de la izquierda, como agua: legato y sin acentos.","Toca para alguien","Compartir música sin presión.","Invita a alguien de casa a escuchar 1 minuto de algo que te guste tocar (lo que tú quieras, no tiene por qué ser del programa).","Partitura sin piano (5')","Lee la partitura de Bach sin tocar, como quien lee un libro: busca algo que no habías visto (una dinámica, una indicación, una nota del bajo).","Lo más importante hoy: Bach — meter cada voz en tu oído interior.","Polonesa en sol menor, BWV Anh. 119","Hoy: Cuaderno de Ana Magdalena Bach (1725), Polonesa en sol menor, BWV Anh. 119.","Canta una, toca dos","Meter cada voz en tu oído interior.","Toca dos voces y canta la tercera. Empieza cantando el bajo.","Cambia: canta la voz del medio.","Es difícil al principio: hazlo lento y por trozos.","Cantas al menos una voz entera mientras tocas las otras.","Prueba de la mesa","las Var. XI y XII (con el Capriccio)","Comprobar si tienes las Var. XI y XII (con el Capriccio) en la cabeza o solo en los dedos.","Con la tapa cerrada, «toca» las Var. XI y XII (con el Capriccio) sobre la madera cantando las notas.","Ahora, lo mismo en el piano.","Lo que no pudiste hacer en la mesa no está memorizado del todo: repásalo con la partitura.","Puedes «tocar» las Var. XI y XII (con el Capriccio) en la tapa sin dudar.","Var. XI: la más virtuosa. Estudia por impulsos (de pulso a pulso). Fuerza sin rigidez.","Var. XII: con gracia; los grupetos (∞) suaves y la izquierda en acordes repetidos muy ligera. El Capriccio (Andante) es misterioso: perdendosi, se pierde.","Juntar las manos en la mitad de abajo de la 1ª página sin errores, poco a poco.","Divide la mitad de abajo de la 1ª página en bloques de 2 compases.","Tocas la mitad de abajo de la 1ª página manos juntas y sin paradas a ♩ = 50.","Brazo, no dedos","Energía sin golpes: que cada arranque furioso salga de un gesto de brazo.","Toca solo los arranques de semicorcheas: una caída de brazo y un movimiento que sube, como una ola.","Sin golpes (lo pidió tu profe): el sonido es lleno pero redondo.","Toca la página entera manteniendo esa sensación.","Los arranques suenan enérgicos y los hombros siguen sueltos.","Piensa en frases largas, no en notas sueltas.","la 1ª página (cc. 1–13)","Mantener viva la lectura de Satie. Todavía no toca memorizarla: solo disfrutarla y que no se olvide.","Toca la 1ª página (cc. 1–13) con partitura, despacio, disfrutando del sonido.","Termina escuchando mentalmente cómo sonará cuando esté lista: Moderato, «souple et expressif» (flexible y expresivo). La izquierda es un reloj tranquilo; la derecha, una voz libre que adorna.","Has tocado la 1ª página (cc. 1–13) sin pararte.","La izquierda (bajo y acorde) marca el tiempo con calma absoluta.","Lo más importante hoy: Bach — subir la velocidad de la 2ª página sin perder limpieza.","Tu obra es tu ejercicio","Convertir el pasaje más difícil de la semana en tu ejercicio técnico.","Pasaje de hoy: el pasaje de semicorcheas de Bach que más te cueste.","Tócalo con 3 ritmos (larga-corta, corta-larga, grupos con parada).","Tócalo en staccato y luego en legato.","Si te atreves, transpórtalo medio tono arriba: obliga al cerebro a pensar, no a repetir.","Lento y exacto: la velocidad vendrá después.","El pasaje sale más fácil al final que al principio.","Minueto en la menor, BWV Anh. 120","Hoy: Cuaderno de Ana Magdalena Bach (1725), Minueto en la menor, BWV Anh. 120.","Empieza a ♩ = 48. Si sale limpio y relajado, sube 4.","Hoy no pases de ♩ = 63.","Tocas la 2ª página limpio a ♩ = 60.","la mitad de arriba de la 2ª página","Fijar una digitación para la mitad de arriba de la 2ª página. Un dedo distinto cada vez es un error garantizado en el futuro.","Termina tocando la mitad de arriba de la 2ª página manos separadas 2 veces sin parar.","Usas siempre los mismos dedos en la mitad de arriba de la 2ª página.","Pasar la 1ª página de la partitura a tu cabeza, 2 compases cada vez.","Tocas la 1ª página de memoria, lento, sin mirar.","La izquierda, como un contrabajo tranquilo.","Descubrir qué quieres contar con la 1ª página.","Toca la primera frase de la 1ª página de 3 maneras: muy tierna, con mucha energía, y triste.","Grábalas con el móvil.","Escucha y elige la que mejor cuenta lo que dice la música. Esa es tu versión esta semana.","Sabes explicar por qué has elegido tu versión.","Música para una escena: lluvia en la ventana. Solo teclas blancas, pedal a medias.","Lo más importante hoy: Bach — una articulación clara y alegre en toda la obra.","Minueto en do menor, BWV Anh. 121","Hoy: Cuaderno de Ana Magdalena Bach (1725), Minueto en do menor, BWV Anh. 121.","La sonrisa de Bach","Una articulación clara y alegre en toda la obra.","Revisa la articulación que marcó tu profe: qué va ligado y qué va separado.","Toca una página exagerando la diferencia entre ligado y suelto.","Vuelve a tocarla natural. «¡Es alegre!»: que se oiga.","La articulación es igual cada vez que se repite un dibujo.","Descubrir cómo está hecha la mitad de arriba de la 2ª página: patrones, escalas, acordes. Lo que entiendes se aprende el doble de rápido.","Busca en la mitad de arriba de la 2ª página los dibujos que se repiten (secuencias, escalas, arpegios) y enciérralos a lápiz.","Ahora toca la mitad de arriba de la 2ª página normal, lento, pensando en lo que has descubierto.","El pedal cambia con la armonía, un poco después de tocar el bajo.","Un vals triste en la menor: izquierda «bajo-acorde-acorde», derecha inventa.","Lo más importante hoy: Bach — convertir los 2 sitios más difíciles de la 2ª página en los más seguros.","Marcha en Re, BWV Anh. 122","Hoy: Cuaderno de Ana Magdalena Bach (1725), Marcha en Re, BWV Anh. 122.","Convertir los 2 sitios más difíciles de la 2ª página en los más seguros.","Localiza las 2 zonas rojas de la 2ª página (los 1-2 compases que más fallan) y márcalas en rojo.","Estudia cada una con un compás antes y otro después, para que encaje en su sitio.","Tócala con 3 ritmos (larga-corta, corta-larga, en grupos con parada) y vuelve al ritmo normal.","Termina tocando la 2ª página entera.","Las zonas rojas salen 3 veces seguidas bien en su contexto.","Juntar las manos en la mitad de arriba de la 2ª página sin errores, poco a poco.","Divide la mitad de arriba de la 2ª página en bloques de 2 compases.","Tocas la mitad de arriba de la 2ª página manos juntas y sin paradas a ♩ = 52.","Tener un mapa mental de la 2ª página: si sabes qué pasa, no se te olvida.","Di en voz alta la estructura de la 2ª página: «4 compases de pregunta, 4 de respuesta, luego una secuencia que baja…».","Puedes contar el mapa de la 2ª página sin mirar la partitura.","Bach listo (15 días antes del concierto)","De memoria y preparado para el escenario.","Hoy solo hay 20 minutos: van enteros a lo más urgente. Lo más importante hoy: Bach — saber cómo sale la obra sin calentar, como en el escenario.","Saber cómo sale la obra sin calentar, como en el escenario.","Sin haberla tocado hoy: tócala entera de memoria como en el concierto. Sales, saludas, 5 segundos de silencio, y no paras pase lo que pase.","Anota qué ha salido bien y dónde has dudado. Esa información vale oro.","Dedica el resto del tiempo SOLO a los sitios de duda.","Has tocado sin parar y sabes exactamente qué arreglar.","Bach alegre: Concierto italiano","Tu profe escribió «¡Es alegre!» en tu Bach. Aquí tienes a Bach en su versión más luminosa.","Escucha: Concierto italiano BWV 971, 1er movimiento.","Pregunta: Bach imita aquí una orquesta con un solo teclado: ¿oyes cuándo toca «toda la orquesta» y cuándo el «solista»?","Pregunta: ¿Qué hace que suene alegre?","Pregunta: ¿Lo prefieres en piano o en clave?","Bach Italian Concerto BWV 971 piano","Bach Italian Concerto BWV 971 harpsichord","Las Invenciones y Sinfonías","Lee la ficha «Las Invenciones y Sinfonías» en la Biblioteca.","Polonesa en sol menor, BWV Anh. 123","Hoy: Cuaderno de Ana Magdalena Bach (1725), Polonesa en sol menor, BWV Anh. 123.","la mitad de abajo de la 2ª página","Fijar una digitación para la mitad de abajo de la 2ª página. Un dedo distinto cada vez es un error garantizado en el futuro.","Termina tocando la mitad de abajo de la 2ª página manos separadas 2 veces sin parar.","Usas siempre los mismos dedos en la mitad de abajo de la 2ª página.","Lo más importante hoy: Bach — aprender a tocar bien con nervios.","Marcha en Sol, BWV Anh. 124","Hoy: Cuaderno de Ana Magdalena Bach (1725), Marcha en Sol, BWV Anh. 124.","Corazón acelerado","Aprender a tocar bien con nervios.","Haz 20 saltos o sube escaleras 1 minuto: el corazón se acelera como antes de salir a escena.","Respira: 4 segundos coges aire, 6 lo sueltas. 3 veces.","Toca la obra entera. Descubrirás que se puede tocar bien con el corazón a mil.","Has tocado la obra entera aunque el corazón iba rápido.","Descubrir cómo está hecha la mitad de abajo de la 2ª página: patrones, escalas, acordes. Lo que entiendes se aprende el doble de rápido.","Busca en la mitad de abajo de la 2ª página los dibujos que se repiten (secuencias, escalas, arpegios) y enciérralos a lápiz.","Ahora toca la mitad de abajo de la 2ª página normal, lento, pensando en lo que has descubierto.","Que los dedos dominen los pasajes rápidos de la 2ª página desde todos los ángulos.","Toca los pasajes rápidos con ritmo con puntillo (larga-corta).","Luego al revés (corta-larga).","Luego en grupos de 4 con parada en la primera nota de cada grupo.","Vuelve al ritmo normal: notarás que va solo.","Los ritmos salen regulares y, al volver al normal, suena más igualado.","la sección B, con grazia (2ª página)","Toca la sección B, con grazia (2ª página) con partitura, despacio, disfrutando del sonido.","Has tocado la sección B, con grazia (2ª página) sin pararte.","Lo más importante hoy: Bach — pasar de «correcto» a «bonito».","Voz de arriba: toca acordes de La mayor y haz que la nota de arriba suene más que las otras. Truco: primero toca solo la de arriba f y las otras sin sonido; luego todas.","Polonesa en sol menor, BWV Anh. 125","Hoy: Cuaderno de Ana Magdalena Bach (1725), Polonesa en sol menor, BWV Anh. 125.","Pasar de «correcto» a «bonito».","Toca la obra a tempo y marca 3 detalles musicales que aún no salen (un p, una respiración, un final de frase).","Trabaja cada uno 2 minutos.","Vuelve a tocar esa parte en contexto.","Los 3 detalles ya se oyen.","Juntar las manos en la mitad de abajo de la 2ª página sin errores, poco a poco.","Divide la mitad de abajo de la 2ª página en bloques de 2 compases.","Tocas la mitad de abajo de la 2ª página manos juntas y sin paradas a ♩ = 56.","Que el final de la 1ª página (lo que peor se suele saber) sea lo más seguro.","Memoriza la ÚLTIMA frase de la 1ª página.","El final de la 1ª página te sale igual de seguro que el principio.","Dirige la orquesta","Sentir la forma de la 3ª página con todo el cuerpo.","Sin tocar: dirige la 3ª página con la mano mientras la cantas por dentro. ¿Dónde crece? ¿Dónde descansa?","Ahora toca dirigiendo con el cuerpo: los crescendos se sienten en el brazo, no solo en los dedos.","Exagera un poco: mejor demasiado que nada.","Los crescendos y diminuendos de la 3ª página se oyen claramente.","Programa de hoy: Bach. Y, si quieres, algo más que te guste.","Improvisa sobre la cadencia andaluza (la menor – sol – fa – mi). Es la base del flamenco de Jerez.","Lo más importante hoy: Bach — verte y oírte como te verá el público.","Musette en Re, BWV Anh. 126","Hoy: Cuaderno de Ana Magdalena Bach (1725), Musette en Re, BWV Anh. 126.","Ensayo general grabado","Verte y oírte como te verá el público.","Grábate en vídeo tocando la obra entera, con entrada y saludo.","Míralo: ¿esperas antes de empezar? ¿dejas terminar el último sonido? ¿cómo están tus hombros?","Elige 1 mejora para mañana y escríbela en el diario.","Has visto el vídeo entero y has elegido 1 mejora.","Ritmo antes que notas","todo el estudio","Que el ritmo de todo el estudio sea seguro antes de preocuparte por las notas.","Di en voz alta el ritmo de todo el estudio («ta-ti-ti») mientras suena el metrónomo.","Toca solo la mano izquierda marcando bien el pulso.","Junta las manos en bloques de 2 compases: cada bloque 3 veces bien seguidas antes de pasar al siguiente.","Une los bloques de 2 en bloques de 4.","Tocas todo el estudio manos juntas sin pararte, aunque sea lento.","Asegurar y hacer música","Las notas de tu nombre: busca una nota para cada letra y construye una melodía con ellas.","Lo más importante hoy: Bach — que cada entrada del tema se
