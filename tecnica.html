<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Técnica de cinco minutos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Caveat:wght@500;600&display=swap">
<style>
/* Concepto: hermano pequeño del Cuaderno de piano. Mismo papel Henle y lápices de colores;
   aquí el protagonista es el teclado dibujado con la digitación de cada escala. */
:root{
  --paper:#F5F7FA; --sheet:#FFFFFF; --ink:#1B2533; --muted:#5B6878; --line:#D8DEE6; --henle:#2D4A6D;
  --tec:#2E67A8; --lec:#2F7D4B; --rep:#B8392C; --ti:#A87708; --esc:#71479A; --tint:#EBF0F6; --ok:#2F7D4B;
  --white-key:#FFFFFF; --black-key:#1B2533; --hl-w:#D7E6F7; --hl-b:#2E67A8; --tonic:#B8392C;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --r:10px; --gut:16px; --maxw:860px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F151D; --sheet:#161E29; --ink:#E4E9F0; --muted:#98A5B5; --line:#2A3544; --henle:#9DBBE0;
  --tec:#7FB0EA; --lec:#76C394; --rep:#F08A7C; --ti:#E7BD55; --esc:#C29BE6; --tint:#1C2735; --ok:#76C394;
  --white-key:#E9EDF2; --black-key:#0B0F15; --hl-w:#A9C8EC; --hl-b:#4F86C6; --tonic:#E0624F; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0F151D; --sheet:#161E29; --ink:#E4E9F0; --muted:#98A5B5; --line:#2A3544; --henle:#9DBBE0;
  --tec:#7FB0EA; --lec:#76C394; --rep:#F08A7C; --ti:#E7BD55; --esc:#C29BE6; --tint:#1C2735; --ok:#76C394;
  --white-key:#E9EDF2; --black-key:#0B0F15; --hl-w:#A9C8EC; --hl-b:#4F86C6; --tonic:#E0624F; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--henle);outline-offset:2px;border-radius:4px}
a{color:var(--henle)}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut);padding-block:0 120px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}
.small{font-size:.88rem;color:var(--muted)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut);display:flex;align-items:center;gap:12px;min-height:52px}
.brand{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:700;white-space:nowrap}
.brand span{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 12px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:700;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tec)}
.iconbtn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;height:36px;min-width:36px;display:inline-grid;place-items:center;padding:0 10px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;background:var(--sheet);white-space:nowrap}
.daynav{display:flex;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.daynav .date{flex:1;min-width:200px}
.date h1{font-size:clamp(1.7rem,5.2vw,2.4rem);line-height:1.1}
.navbtns{display:flex;gap:6px;align-items:center}
.navbtns input{border:1px solid var(--line);background:var(--sheet);border-radius:999px;height:36px;padding:0 10px;max-width:160px}
.weekband{margin-top:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.keybadge{font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.15;background:var(--ink);color:var(--paper);border-radius:var(--r);padding:10px 14px;text-align:center;min-width:120px}
.keybadge small{display:block;font-family:var(--f-body);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;opacity:.75;font-weight:700}
.phaseline{font-size:.92rem}
.phaseline b{display:block;font-family:var(--f-display);font-size:1.15rem;font-weight:500}
.dots7{display:flex;gap:6px;margin-top:6px}
.dots7 i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots7 i.done{background:var(--ok)} .dots7 i.cur{outline:2px solid var(--ink);outline-offset:1px}
.focus{margin-top:18px;font-family:var(--f-hand);font-size:1.6rem;line-height:1.2;color:var(--henle)}
.ex{margin-top:16px}
.ex h2{font-size:1.55rem;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.cat{color:var(--tec);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.check{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--sheet);display:grid;place-items:center}
.check svg{opacity:0}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.check[aria-pressed="true"] svg{opacity:1;color:var(--paper)}
.obj{margin-top:8px}
.lbl{font-weight:700}
.steps{margin:10px 0 0;padding-left:1.4em;display:grid;gap:6px}
.steps li::marker{color:var(--tec);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.metro-pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 6px 4px 12px;font-size:.9rem;border:1px solid color-mix(in srgb,var(--tec) 55%,var(--line));background:var(--sheet)}
.metro-pill .mv{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.play{border:0;background:var(--ink);color:var(--paper);border-radius:999px;height:30px;padding:0 12px;font-size:.82rem;font-weight:700}
.ghost{border:1px solid var(--line);background:var(--sheet);border-radius:999px;height:34px;padding:0 14px;font-size:.88rem;font-weight:700}
.ok{margin-top:12px;display:flex;gap:8px;align-items:flex-start}
.ok svg{flex:none;margin-top:4px;color:var(--ok)}
.why{margin-top:12px;font-size:.92rem;color:var(--muted);font-style:italic}
.kbwrap{margin-top:14px;overflow-x:auto}
.kbwrap svg{display:block;max-width:100%;height:auto}
.kbcap{font-size:.84rem;color:var(--muted);margin-top:4px}
.cadrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.cad{margin:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--sheet);min-width:0}
.cad figcaption{font-size:.85rem;margin-bottom:2px}
.cadlbl{margin-top:14px;font-weight:700}
.seqwrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
.seq{border-collapse:collapse;font-size:.95rem;text-align:center;white-space:nowrap}
.seq th{font-size:.72rem;letter-spacing:.06em;padding:4px 8px;position:sticky;left:0;background:var(--sheet);text-align:left}
.seq th.dir{position:static;text-align:left;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
.seq td{padding:3px 5px;min-width:2.4em}
.seq td.b,.seq td[class=""]{}
.seq td.b{border-left:2px solid var(--line)}
.seq td.rh,.seq th.rh{color:var(--tec);font-weight:700}
.seq td.lh,.seq th.lh{color:var(--rep);font-weight:700}
.seq .ton{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.record{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:10px 12px;background:var(--tint);border-radius:var(--r)}
.record input{width:90px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 8px}
.section{margin-top:26px}
.section>h2{font-size:1.6rem;margin-bottom:10px}
.phases{display:grid;gap:12px}
.phase.now{border-color:var(--tec);box-shadow:0 0 0 1px var(--tec) inset}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.wk{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 8px;text-align:left;font-size:.82rem;line-height:1.3}
.wk b{display:block;font-size:.9rem}
.wk.now{border-color:var(--ink);outline:1px solid var(--ink)}
.wk .bar{height:4px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.wk .bar i{display:block;height:100%;background:var(--ok)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.sub button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem}
.sub button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.prose p,.prose li{max-width:68ch}
/* metrónomo */
.sheet-panel{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sheet);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.12);padding:14px var(--gut) calc(14px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:grid;gap:12px}
.mhead{display:flex;justify-content:space-between;align-items:center}
.mbig{display:flex;align-items:center;justify-content:center;gap:14px}
.mbig .bpm{font-family:var(--f-display);font-size:3.6rem;font-weight:700;line-height:1;min-width:3ch;text-align:center;font-variant-numeric:tabular-nums}
.round{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:1.2rem;font-weight:700}
.beats{display:flex;justify-content:center;gap:8px;min-height:16px}
.beats i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.beats i.on{background:var(--rep);transform:scale(1.25)}
.beats i.first.on{background:var(--tec)}
.mrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.mrow input[type=range]{width:100%}
.startstop{height:48px;border:0;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:700;padding:0 26px}
.fab{position:fixed;right:var(--gut);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:999px;background:var(--ink);color:var(--paper);height:52px;padding:0 18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.timerbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:31;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.timerbar .tt{font-family:var(--f-display);font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums}
@media (max-width:560px){ .brand span{display:none} .weekband{grid-template-columns:1fr} .keybadge{text-align:left} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>


<header class="top">
  <div class="top-in">
    <div class="brand"><b>Técnica de 5 minutos</b><span>Escalas, arpegios y control · un año</span></div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button class="tab" role="tab" data-tab="hoy" id="tab-hoy">Hoy</button>
    <button class="tab" role="tab" data-tab="plan" id="tab-plan">Plan del año</button>
    <button class="tab" role="tab" data-tab="escalas" id="tab-escalas">Escalas y digitaciones</button>
    <button class="tab" role="tab" data-tab="como" id="tab-como">Cómo funciona</button>
  </nav>
</header>
<main class="wrap" id="main"></main>
<button class="fab" id="fab">Metrónomo</button>
<div class="timerbar" id="timerbar" hidden><span class="tt" id="tTime">5:00</span><button class="ghost" id="tPause">Pausa</button><button class="ghost" id="tStop" aria-label="Parar">✕</button></div>
<section class="sheet-panel" id="metro" hidden aria-label="Metrónomo">
  <div class="sheet-in">
    <div class="mhead"><span class="eyebrow">Metrónomo</span><button class="ghost" id="mClose">Cerrar</button></div>
    <div class="mbig">
      <button class="round" id="mMinus5">−5</button><button class="round" id="mMinus">−</button>
      <div><div class="bpm" id="mBpm">60</div><div class="small" style="text-align:center">♩ por minuto</div></div>
      <button class="round" id="mPlus">+</button><button class="round" id="mPlus5">+5</button>
    </div>
    <input type="range" id="mRange" min="30" max="220" value="60" aria-label="Tempo">
    <div class="beats" id="mBeats"></div>
    <div class="mrow"><label class="small" for="mMeter">Pulsos por compás</label>
      <select id="mMeter" class="ghost"><option>1</option><option>2</option><option>3</option><option selected>4</option></select>
      <button class="startstop" id="mStart">Empezar</button></div>
  </div>
</section>

<script>
(function(){
"use strict";
/* ================= TEORÍA ================= */
const LETTERS=["Do","Re","Mi","Fa","Sol","La","Si"], LPC=[0,2,4,5,7,9,11];
const ACC={"-2":"𝄫","-1":"♭","0":"","1":"♯","2":"𝄪"};
const INT={mayor:[2,2,1,2,2,2,1],armonica:[2,1,2,2,1,3,1],melodica:[2,1,2,2,2,2,1],
  dorico:[2,1,2,2,2,1,2],frigio:[1,2,2,2,1,2,2],lidio:[2,2,2,1,2,2,1],mixolidio:[2,2,1,2,2,1,2],eolico:[2,1,2,2,1,2,2],locrio:[1,2,2,1,2,2,2],
  frigiodom:[1,3,1,2,1,2,2]};
function spell(L,pc,ints){ const out=[]; let cum=0; for(let i=0;i<=ints.length;i++){ const l=(L+i)%7, p=(pc+cum)%12; let d=((p-LPC[l])%12+18)%12-6; out.push({name:LETTERS[l]+(ACC[d]||""),pc:p,semi:cum}); if(i<ints.length) cum+=ints[i]; } return out; }
// tonalidades en orden del círculo de quintas: [nombre mayor, letra, pc, nombre menor, letra, pc]
const KEYS=[
 ["Do mayor",0,0,"la menor",5,9],["Sol mayor",4,7,"mi menor",2,4],["Re mayor",1,2,"si menor",6,11],["La mayor",5,9,"fa♯ menor",3,6],
 ["Mi mayor",2,4,"do♯ menor",0,1],["Si mayor",6,11,"sol♯ menor",4,8],["Fa♯ mayor",3,6,"mi♭ menor (= re♯ menor)",2,3],["Re♭ mayor",1,1,"si♭ menor",6,10],
 ["La♭ mayor",5,8,"fa menor",3,5],["Mi♭ mayor",2,3,"do menor",0,0],["Si♭ mayor",6,10,"sol menor",4,7],["Fa mayor",3,5,"re menor",1,2]];
// digitaciones estándar (una octava ascendente, 8 notas). En varias octavas, el 5 final se sustituye por el 1 (MD) y la MI empieza solo una vez con 5.
const FM={0:["12312345","54321321"],7:["12312345","54321321"],2:["12312345","54321321"],9:["12312345","54321321"],4:["12312345","54321321"],
  11:["12312345","43214321"],6:["23412312","43213214"],1:["23123412","32143213"],8:["34123123","32143213"],3:["31234123","32143213"],10:["41231234","32143213"],5:["12341234","54321321"]};
const Fm={9:["12312345","54321321"],4:["12312345","54321321"],11:["12312345","43214321"],6:["34123123","43213214"],1:["34123123","32143213"],
  8:["34123123","32132143"],3:["31234123","21432132"],10:["21231234","21321432"],5:["12341234","54321321"],0:["12312345","54321321"],7:["12312345","54321321"],2:["12312345","54321321"]};
const WHITE="12312345", WHITEL="54321321";

/* ================= TECLADO SVG ================= */
function keyboard(notes, rh, lh, opts){
  opts=opts||{}; const W=28, H=100, BW=17, BH=60, top=20, nW=14;
  const whitePcs=[0,2,4,5,7,9,11], blackX={1:1,3:2,6:4,8:5,10:6};
  const base = notes[0].pc; // octava 0 empieza en Do
  const pos = notes.map(n=>n.pc>=base? n.pc + 0 : n.pc+12).map((p,i)=>notes[0].pc + notes[i].semi); // semitono absoluto desde Do
  const hl={}; pos.forEach((p,i)=>hl[p]=i);
  const xOf=p=>{ const o=Math.floor(p/12), pc=p%12; if(whitePcs.includes(pc)) return o*7*W + whitePcs.indexOf(pc)*W + W/2; return o*7*W + blackX[pc]*W; };
  let s=`<svg viewBox="0 0 ${nW*W+2} ${H+top+26}" width="${nW*W+2}" role="img" aria-label="Teclado con la escala y su digitación">`;
  for(let i=0;i<nW;i++){ const o=Math.floor(i/7), pc=whitePcs[i%7], p=o*12+pc, on=hl[p]!==undefined;
    s+=`<rect x="${i*W+1}" y="${top}" width="${W}" height="${H}" rx="3" fill="${on?(hl[p]===0||hl[p]===notes.length-1?'var(--tonic)':'var(--hl-w)'):'var(--white-key)'}" stroke="var(--muted)" stroke-width=".8"/>`; }
  for(let o=0;o<2;o++) for(const pc of [1,3,6,8,10]){ const p=o*12+pc, on=hl[p]!==undefined, x=o*7*W+blackX[pc]*W-BW/2+1;
    s+=`<rect x="${x}" y="${top}" width="${BW}" height="${BH}" rx="2" fill="${on?(hl[p]===0||hl[p]===notes.length-1?'var(--tonic)':'var(--hl-b)'):'var(--black-key)'}"/>`; }
  pos.forEach((p,i)=>{ const x=xOf(p)+1;
    if(rh) s+=`<text x="${x}" y="${top-6}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--tec)" font-family="var(--f-body)">${rh[i]}</text>`;
    if(lh) s+=`<text x="${x}" y="${top+H+18}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--rep)" font-family="var(--f-body)">${lh[i]}</text>`; });
  s+=`</svg>`; return s;
}
// Secuencia completa subiendo y bajando, con la digitación de cada nota.
// MD: cada octava repite los 7 primeros dedos; la nota más alta lleva el último dedo del patrón.
// MI: la nota más grave lleva el primer dedo; las tónicas intermedias y la de arriba, el último.
function fullSeq(notes, fing, octs){
  const R=fing?fing[0].split(""):null, L=fing?fing[1].split(""):null, n=notes.length-1, up=[];
  for(let o=0;o<octs;o++) for(let i=0;i<n;i++) up.push({name:notes[i].name, ton:i===0, rh:R?R[i]:"", lh:L?((o===0&&i===0)?L[0]:(i===0?L[n]:L[i])):""});
  up.push({name:notes[n].name, ton:true, top:true, rh:R?R[n]:"", lh:L?L[n]:""});
  const down=up.slice(0,-1).reverse();
  return {up, down};
}
function seqTable(notes, fing, octs, per){
  const q=fullSeq(notes,fing,octs), all=q.up.concat(q.down), nUp=q.up.length;
  const cell=(x,i,row)=>{ const brk=(i>0 && i%per===0)?' class="b"':''; 
    if(row==="n") return `<td${brk}><span class="${x.ton?"ton":""}">${x.name}</span></td>`;
    return `<td class="${row}${i>0&&i%per===0?" b":""}">${row==="rh"?x.rh:x.lh}</td>`; };
  let h=`<div class="seqwrap"><table class="seq" aria-label="Digitación completa"><thead><tr><th></th><th colspan="${nUp}" class="dir">Sube ↗</th><th colspan="${all.length-nUp}" class="dir">Baja ↘</th></tr></thead><tbody>`;
  if(fing) h+=`<tr><th class="rh">MD</th>${all.map((x,i)=>cell(x,i,"rh")).join("")}</tr>`;
  h+=`<tr><th></th>${all.map((x,i)=>cell(x,i,"n")).join("")}</tr>`;
  if(fing) h+=`<tr><th class="lh">MI</th>${all.map((x,i)=>cell(x,i,"lh")).join("")}</tr>`;

// Teclado genérico de N octavas con marcas {abs, hand:'rh'|'lh', f}
function kb2(lo, hi, marks){
  // dibuja solo las teclas entre lo y hi (semitonos absolutos), ajustado a teclas blancas
  const W=20,H=78,BW=12,BH=48,top=18, whitePcs=[0,2,4,5,7,9,11], isW=p=>whitePcs.includes(((p%12)+12)%12);
  while(!isW(lo)) lo--; while(!isW(hi)) hi++;
  const wIdx=p=>Math.floor(p/12)*7+whitePcs.indexOf(p%12), w0=wIdx(lo), nW=wIdx(hi)-w0+1, blackX={1:1,3:2,6:4,8:5,10:6};
  const by={}; marks.forEach(m=>by[m.abs]=m);
  const xOf=p=>{ const o=Math.floor(p/12), pc=p%12; return isW(p)? (wIdx(p)-w0)*W+W/2 : (o*7+blackX[pc]-w0)*W; };
  const col=m=>m.hand==="rh"?"var(--hl-b)":"var(--tonic)";
  let s=`<svg viewBox="0 0 ${nW*W+2} ${H+top+22}" width="${nW*W+2}" role="img" aria-label="Posición de las manos">`;
  for(let p=lo;p<=hi;p++) if(isW(p)){ const m=by[p]; s+=`<rect x="${(wIdx(p)-w0)*W+1}" y="${top}" width="${W}" height="${H}" rx="2" fill="${m?col(m):'var(--white-key)'}" stroke="var(--muted)" stroke-width=".7"/>`; }
  for(let p=lo;p<=hi;p++) if(!isW(p)){ const m=by[p]; s+=`<rect x="${xOf(p)-BW/2+1}" y="${top}" width="${BW}" height="${BH}" rx="2" fill="${m?col(m):'var(--black-key)'}" ${m?'stroke="var(--ink)" stroke-width="1.2"':''}/>`; }
  marks.forEach(m=>{ const x=xOf(m.abs)+1; if(m.hand==="rh") s+=`<text x="${x}" y="${top-5}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--tec)">${m.f}</text>`;
    else s+=`<text x="${x}" y="${top+H+16}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--rep)">${m.f}</text>`; });
  return s+`</svg>`;
}
function perms3(a){ return [[a[0],a[1],a[2]],[a[0],a[2],a[1]],[a[1],a[0],a[2]],[a[1],a[2],a[0]],[a[2],a[0],a[1]],[a[2],a[1],a[0]]]; }
function nearest(cur, pc){ let best=null; for(let k=-2;k<=2;k++){ const c=pc+12*(Math.floor(cur/12)+k); if(best===null||Math.abs(c-cur)<Math.abs(best-cur)||(Math.abs(c-cur)===Math.abs(best-cur)&&c<best)) best=c; } return best; }
function lead(prev, pcs){ let best=null, bc=1e9; for(const pr of perms3(pcs)){ const v=prev.map((p,i)=>nearest(p,pr[i])); const c=v.reduce((a,x,i)=>a+Math.abs(x-prev[i]),0); if(new Set(v).size===3 && c<bc){bc=c;best=v;} } return best.slice().sort((a,b)=>a-b); }
function rhFing(v){ const a=v[1]-v[0], b=v[2]-v[1]; if(b<=2) return ["1","4","5"]; if(a<=2) return ["1","2","5"]; if(b===5) return ["1","2","5"]; return ["1","3","5"]; }
function cadence(L, pc, minor, startInv){
  const sc=spell(L,pc,minor?INT.armonica:INT.mayor); // grados 0..7
  const deg=(arr)=>arr.map(i=>sc[i]);
  const chords=[{n:minor?"i":"I",d:[0,2,4],b:0},{n:minor?"iv":"IV",d:[3,5,0],b:3},{n:"V7",d:[4,6,3],b:4},{n:minor?"i":"I",d:[0,2,4],b:0}];
  // posición inicial de la derecha (octava central)
  const root=12+pc, tri=[root, root+(minor?3:4), root+7];
  let v = startInv===0? tri : startInv===1? [tri[1],tri[2],tri[0]+12] : [tri[2]-12,tri[0],tri[1]];
  if(v[0]<12) v=v.map(x=>x+12);
  const lhF=["5","2","1","5"], out=[];
  chords.forEach((c,i)=>{
    if(i>0) v=lead(v, c.d.map(j=>sc[j].pc));
    const bass=pc+(c.b===0?0:(c.b===3?5:7)); // bajo en la octava grave
    const f=rhFing(v);
    const names=v.map(a=>{ const s0=sc.find(n=>n.pc===a%12); return s0?s0.name:""; });
    out.push({n:c.n, marks:v.map((a,k)=>({abs:a,hand:"rh",f:f[k]})).concat([{abs:bass,hand:"lh",f:lhF[i]}]), rh:names, bass:sc[c.b].name});
  });
  return out;
}
function cadenceHtml(K, minor, inv){
  const L=minor?K[4]:K[1], pc=minor?K[5]:K[2], c=cadence(L,pc,minor,inv);
  const all=c.flatMap(x=>x.marks.map(m=>m.abs)), lo=Math.min(...all)-1, hi=Math.max(...all)+1;
  return `<div class="cadrow">${c.map(x=>`<figure class="cad"><figcaption><b>${x.n}</b> · ${x.rh.join("-")} <span style="color:var(--rep)">/ bajo ${x.bass}</span></figcaption><div class="kbwrap">${kb2(lo,hi,x.marks)}</div></figure>`).join("")}</div>`;
}

/* ================= ESTADO ================= */
const KEY="tecnica-5min-v1";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null")||{done:{},rec:{}}; }catch(e){ return {done:{},rec:{}}; } }
let ST=load(); if(!ST.done) ST.done={}; if(!ST.rec) ST.rec={};
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} }
const $=s=>document.querySelector(s);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pad(n){return (n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function diff(a,b){return Math.round((parse(b)-parse(a))/86400000)}
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"], DIA=["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
const END=addDays(START,WEEKS*7-1);
function clampDate(s){ return s<START?START:(s>END?END:s); }
function wdOf(s){ return diff(START,s)%7; }
function weekOf(s){ return Math.floor(diff(START,s)/7)+1; }
function longDate(s){ const d=parse(s); return DIA[wdOf(s)].replace(/^./,c=>c.toUpperCase())+" "+d.getDate()+" de "+MES[d.getMonth()]; }
let cur=clampDate(iso(new Date())), tab="hoy", escTab="mayores";
const ICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

function renderHoy(){
  const w=weekOf(cur), d=wdOf(cur), x=dayData(w,d), ph=x.ph;
  let dots=""; for(let i=0;i<7;i++){ const ds=addDays(cur,i-d); dots+=`<i class="${ST.done[ds]?"done":""} ${i===d?"cur":""}" title="${DIA[i]}"></i>`; }
  let h=`<div class="daynav"><div class="date"><div class="eyebrow">Semana ${w} de ${WEEKS} · ${esc(ph.n)}</div><h1>${longDate(cur)}</h1></div>
   <div class="navbtns"><button class="iconbtn" id="prev" aria-label="Día anterior">‹</button><input type="date" id="pick" min="${START}" max="${END}" value="${cur}" aria-label="Elegir fecha"><button class="iconbtn" id="next" aria-label="Día siguiente">›</button><button class="iconbtn" id="today">Hoy</button></div></div>
   <div class="weekband"><div class="keybadge">${x.key?`<small>Tonalidades de la semana</small>${esc(x.key[0])}<br>${esc(x.key[3])}`:`<small>Semana de repaso</small>Todas`}</div>
   <div class="phaseline"><b>Fase ${PHASES.indexOf(ph)+1}: ${esc(ph.n)}</b>${esc(ph.f)}<div class="dots7">${dots}</div></div></div>
   <div class="focus">5 minutos. Una sola cosa, bien hecha.</div>
   <article class="card ex"><div class="cat">${esc(x.cat)}</div>
   <h2><span>${esc(x.title)}</span><button class="check" id="chk" aria-pressed="${!!ST.done[cur]}" aria-label="Marcar como hecho">${ICON}</button></h2>
   <ol class="steps">${x.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
   <div class="row"><span class="metro-pill"><span>Metrónomo:</span><span class="mv num">♩ = ${x.t}</span><button class="play" id="play">▶ Poner</button></span><span class="small">${esc(x.sub)}</span></div>
   <div class="small" style="margin-top:4px">Si no sale limpio, baja el metrónomo hasta que salga. Mejor lento y perfecto que rápido y sucio.</div>
   ${x.cad?x.cad.map(inv=>`<div class="cadlbl">${["Empezando en posición fundamental","Empezando en 1ª inversión","Empezando en 2ª inversión"][inv]} · ${esc(x.key[0])}</div>${cadenceHtml(x.key,false,inv)}<div class="cadlbl" style="margin-top:8px">${esc(x.key[3].split(" (")[0])}</div>${cadenceHtml(x.key,true,inv)}`).join("")+`<div class="kbcap">Números azules: dedos de la mano derecha. Números rojos: dedo de la mano izquierda para el bajo (5–2–1–5). En el V7 la derecha toca tres notas del acorde de séptima (sin la quinta), como se hace en las cadencias de teclado.</div>`:""}
   ${x.arp?`<div class="kbwrap">${keyboard(x.scale.notes,null,null)}</div><div class="kbcap">Notas del arpegio de ${esc(x.key[0])}. La digitación depende de la tonalidad: tu profe te dirá la suya.</div>`:""}
   ${x.scale&&!x.arp?scaleBlock(x.scale.name,x.scale.notes,x.scale.fing,x.scaleNote,x.octs||2,x.per||4):""}
   <div class="ok">${ICON.replace('width="18" height="18"','width="16" height="16"')}<span><span class="lbl">Lo has conseguido si: </span>${esc(x.ok)}</span></div>
   <div class="why">${esc(x.why)}</div>
   ${x.record?`<div class="record"><label for="rec"><b>Récord de la semana ${w}</b> (♩ semicorcheas):</label><input id="rec" type="number" min="30" max="200" value="${esc(ST.rec[w]||"")}" placeholder="—"><span class="small" id="recok"></span></div>`:""}
   <div class="row"><button class="ghost" id="timer">Temporizador 5′</button></div></article>`;
  return h;
}
function bindHoy(){
  $("#prev").onclick=()=>{ if(cur>START){cur=addDays(cur,-1);render();} };
  $("#next").onclick=()=>{ if(cur<END){cur=addDays(cur,1);render();} };
  $("#today").onclick=()=>{ cur=clampDate(iso(new Date())); render(); };
  $("#pick").onchange=e=>{ if(e.target.value){ cur=clampDate(e.target.value); render(); } };
  $("#chk").onclick=()=>{ if(ST.done[cur]) delete ST.done[cur]; else ST.done[cur]=true; save(); render(); };
  const w=weekOf(cur), x=dayData(w,wdOf(cur));
  $("#play").onclick=()=>openMetro(x.t,true);
  $("#timer").onclick=()=>startTimer(5);
  const r=$("#rec"); if(r) r.oninput=()=>{ ST.rec[w]=r.value; save(); $("#recok").textContent="Guardado"; };
}
function renderPlan(){
  const tw=weekOf(clampDate(iso(new Date())));
  let h=`<div class="section"><div class="eyebrow">52 semanas · 5 minutos al día</div><h2 style="font-size:2rem;margin-top:4px">Plan del año</h2>
  <p class="small">Del ${longDate(START).toLowerCase()} de 2026 al ${longDate(END).toLowerCase()} de 2027. Cada fase recorre las 12 tonalidades del círculo de quintas y termina con una semana de repaso. Pulsa una semana para ir a su lunes.</p></div><div class="phases">`;
  PHASES.forEach((p,i)=>{
    h+=`<div class="card phase ${tw>=p.a&&tw<=p.z?"now":""}"><div class="eyebrow">Fase ${i+1} · semanas ${p.a}–${p.z} · ♩ = ${p.t0} → ${p.t1}</div><h3 style="font-size:1.35rem">${esc(p.n)}</h3><p class="small" style="margin:.3em 0 0">${esc(p.f)}</p><div class="weeks">`;
    for(let w=p.a;w<=p.z;w++){ const K=keyOfWeek(w), mon=addDays(START,(w-1)*7); let n=0; for(let k=0;k<7;k++) if(ST.done[addDays(mon,k)]) n++;
      h+=`<button class="wk ${w===tw?"now":""}" data-w="${w}"><b>Semana ${w}</b>${K?esc(K[0])+" · "+esc(K[3].split(" (")[0]):"Repaso"}<br><span class="small">${parse(mon).getDate()} ${MES[parse(mon).getMonth()].slice(0,3)}${ST.rec[w]?" · récord ♩="+esc(ST.rec[w]):""}</span><div class="bar"><i style="width:${Math.round(n/7*100)}%"></i></div></button>`; }
    h+=`</div></div>`; });
  return h+`</div>`;
}
function bindPlan(){ document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ cur=addDays(START,(+b.dataset.w-1)*7); setTab("hoy"); }); }
function renderEscalas(){
  const tabs=[["mayores","Mayores"],["menores","Menores armónicas"],["modos","Modos y especiales"]];
  let h=`<div class="section"><div class="eyebrow">Consulta</div><h2 style="font-size:2rem;margin-top:4px">Escalas y digitaciones</h2>
  <p class="small">Digitaciones estándar de una octava subiendo. En escalas de varias octavas, el 5 de la mano derecha se cambia por 1 al pasar de octava, y la izquierda solo usa el 5 al empezar. Si tu profe te da otra digitación, manda la profe.</p>
  <div class="sub">${tabs.map(t=>`<button data-e="${t[0]}" aria-pressed="${escTab===t[0]}">${t[1]}</button>`).join("")}</div></div><div class="grid2" style="margin-top:14px">`;
  if(escTab==="mayores") KEYS.forEach(k=>{ h+=`<div class="card"><h3 style="font-size:1.2rem">${esc(k[0])}</h3>${scaleBlock(k[0],spell(k[1],k[2],INT.mayor),FM[k[2]])}</div>`; });
  else if(escTab==="menores") KEYS.forEach(k=>{ h+=`<div class="card"><h3 style="font-size:1.2rem">${esc(k[3])}</h3>${scaleBlock(k[3],spell(k[4],k[5],INT.armonica),Fm[k[5]])}</div>`; });
  else { MODES.forEach(m=>{ h+=`<div class="card"><h3 style="font-size:1.2rem">${esc(m[0])}</h3><p class="small" style="margin:.2em 0 0">${esc(m[4])}</p>${scaleBlock(m[0],spell(m[2],m[3],INT[m[1]]),[WHITE,WHITEL])}</div>`; });
    h+=`<div class="card"><h3 style="font-size:1.2rem">Escala andaluza (mi frigio con tercera mayor)</h3><p class="small" style="margin:.2em 0 0">${esc(SPECIAL4[0][4])}</p>${scaleBlock("",spell(2,4,INT.frigiodom),null,"Digitación libre: pulgar siempre en tecla blanca.")}</div>`; }
  return h+`</div>`;
}
function bindEscalas(){ document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{ escTab=b.dataset.e; render(); }); }
function renderComo(){
  return `<div class="section prose card"><h2 style="font-size:1.7rem">Cómo funciona</h2>
  <p>Cinco minutos al día, todos los días si se puede. Cada día de la semana trabaja una cosa distinta sobre las mismas tonalidades, así que el domingo esas dos tonalidades ya están en tus manos.</p>
  <ul><li><b>Lunes:</b> escala mayor. <b>Martes:</b> escala menor. <b>Miércoles:</b> arpegios. <b>Jueves:</b> acordes y cadencias. <b>Viernes:</b> velocidad. <b>Sábado:</b> coordinación y dinámica. <b>Domingo:</b> escala especial (cromática, modos, escalas de color) y récord.</li>
  <li><b>Cuatro fases de 13 semanas:</b> estabilidad, velocidad, dinámica y articulación, y color y brillo. Cada una recorre las 12 tonalidades y acaba con una semana de repaso.</li>
  <li><b>El metrónomo marca el tempo de hoy.</b> Sube poco a poco a lo largo del año. Si no sale limpio, bájalo sin miedo: la regla es 3 veces seguidas limpio y relajado.</li>
  <li><b>Si un día no puedes</b> (por ejemplo, los jueves), no pasa nada: no se recupera. Al día siguiente, el ejercicio de ese día.</li>
  <li><b>Si tu profe te manda otra técnica</b> (Hanon, Czerny…), estos 5 minutos se pueden hacer como calentamiento antes.</li></ul>
  <p>Tres reglas para que la técnica sirva de verdad: hombros y muñeca sueltos siempre; escucha cada nota (si no la escuchas, no la estás practicando); y mejor lento y bonito que rápido y sucio.</p></div>`;
}
function setTab(t){ tab=t; document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t?"true":"false")); try{history.replaceState(null,"","#"+t)}catch(e){} render(); window.scrollTo({top:0}); }
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function render(){ const m=$("#main");
  if(tab==="hoy"){ m.innerHTML=renderHoy(); bindHoy(); } else if(tab==="plan"){ m.innerHTML=renderPlan(); bindPlan(); }
  else if(tab==="escalas"){ m.innerHTML=renderEscalas(); bindEscalas(); } else { m.innerHTML=renderComo(); } }

/* ================= METRÓNOMO ================= */
let ac=null,mOn=false,mBpm=60,mN=4,mNext=0,mBeat=0,mT=null;
function ensureAC(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); }catch(e){} return ac; }
function clk(t,a){ const o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=a?1760:1100; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(a?0.8:0.5,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.06); }
function drawB(){ let h=""; for(let i=0;i<mN;i++) h+=`<i class="${i===0?"first":""}"></i>`; $("#mBeats").innerHTML=h; }
function fl(i){ const d=$("#mBeats").children; for(let k=0;k<d.length;k++) d[k].classList.toggle("on",k===i); }
function sched(){ while(mNext<ac.currentTime+0.12){ const b=mBeat%mN; clk(mNext,b===0&&mN>1); setTimeout(()=>fl(b),Math.max(0,(mNext-ac.currentTime)*1000)); mNext+=60/mBpm; mBeat++; } }
function mStart(){ if(!ensureAC()) return; mOn=true; mBeat=0; mNext=ac.currentTime+0.08; clearInterval(mT); mT=setInterval(sched,25); $("#mStart").textContent="Parar"; }
function mStop(){ mOn=false; clearInterval(mT); $("#mStart").textContent="Empezar"; fl(-1); }
function setB(v){ mBpm=Math.max(30,Math.min(220,Math.round(v))); $("#mBpm").textContent=mBpm; $("#mRange").value=mBpm; }
function openMetro(b,auto){ $("#metro").hidden=false; if(b) setB(b); if(auto) mStart(); }
$("#fab").onclick=()=>{ $("#metro").hidden?openMetro():($("#metro").hidden=true); };
$("#mClose").onclick=()=>{ mStop(); $("#metro").hidden=true; };
$("#mStart").onclick=()=>{ mOn?mStop():mStart(); };
$("#mMinus").onclick=()=>setB(mBpm-1); $("#mPlus").onclick=()=>setB(mBpm+1); $("#mMinus5").onclick=()=>setB(mBpm-5); $("#mPlus5").onclick=()=>setB(mBpm+5);
$("#mRange").oninput=e=>setB(+e.target.value); $("#mMeter").onchange=e=>{ mN=+e.target.value; mBeat=0; drawB(); }; drawB();
/* temporizador */
let tl=0,tr=false,ti=null;
function fmt(s){ return Math.floor(s/60)+":"+pad(s%60); }
function chime(){ if(!ensureAC()) return; const t=ac.currentTime; [0,.18,.36].forEach((d,i)=>{ const o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=[880,1108,1318][i]; g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.4,t+d+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.6); o.connect(g); g.connect(ac.destination); o.start(t+d); o.stop(t+d+0.65); }); }
function startTimer(m){ ensureAC(); tl=m*60; tr=true; $("#tTime").textContent=fmt(tl); $("#timerbar").hidden=false; clearInterval(ti); ti=setInterval(()=>{ if(!tr) return; tl--; $("#tTime").textContent=fmt(Math.max(0,tl)); if(tl<=0){ clearInterval(ti); tr=false; chime(); $("#tTime").textContent="¡Hecho!"; } },1000); }
$("#tPause").onclick=()=>{ tr=!tr; $("#tPause").textContent=tr?"Pausa":"Seguir"; };
$("#tStop").onclick=()=>{ clearInterval(ti); tr=false; $("#timerbar").hidden=true; };
const h0=(location.hash||"").slice(1); setTab(["hoy","plan","escalas","como"].includes(h0)?h0:"hoy");
})();
</script>
